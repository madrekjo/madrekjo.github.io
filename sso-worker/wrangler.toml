# Cloudflare Worker config for the unified SSO endpoint (https://madrekjo-sso.madrekjo.workers.dev)
#
# 1) Create the KV namespace and copy the returned id below:
#      wrangler kv namespace create SSO_KV
#    -> output contains:  id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
#    -> paste that id in the [[kv_namespaces]] block below (REPLACE_WITH_YOUR_KV_NAMESPACE_ID)
#
# 2) Set secrets (interactive, values are NOT stored in any file):
#      wrangler secret put GOOGLE_CLIENT_ID
#      wrangler secret put GOOGLE_CLIENT_SECRET
#      wrangler secret put SSO_HMAC_KEY
#      wrangler secret put CHAT_SUPABASE_URL
#      wrangler secret put CHAT_ANON_KEY
#      wrangler secret put ACHIEVEMENT_SUPABASE_URL
#      wrangler secret put ACHIEVEMENT_ANON_KEY
#
# 3) Deploy:
#      wrangler deploy
#
# The worker derives its Google redirect_uri from the request origin, so it becomes:
#   https://madrekjo-sso.madrekjo.workers.dev/callback
# which must be registered in Google Cloud Console (no code change needed).
#
# CORS defaults to https://madrekjo.github.io (APP_ORIGIN / ALLOWED_ORIGINS below are optional overrides).

name = "madrekjo-sso"
main = "sso-worker.js"
compatibility_date = "2024-12-01"

[vars]
CHAT_SUPABASE_URL = "https://hvrtzzouasqseyswjcex.supabase.co"
CHAT_ANON_KEY = "sb_publishable_nJGYgrQQhe8r6ohmmkkCdA_8-ivUaMC"
ACHIEVEMENT_SUPABASE_URL = "https://itflhfhsfzrdfpxvlzrv.supabase.co"
ACHIEVEMENT_ANON_KEY = "sb_publishable_3mypt4J1F0sG5RD6oTSZZg_6PNgwoyY"

[[kv_namespaces]]
binding = "SSO_KV"
id = "9af41e3eb4714659a871dfad3970b05d"

[[d1_databases]]
binding = "madrekjo_sso_db"
database_name = "madrekjo-sso-db"
database_id = "4e83b11c-427d-489f-81c0-1f71ddfc5d94"
