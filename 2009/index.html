<script>
const FIELDS = {
  engineering: {
    name: 'العلوم والتكنولوجيا والهندسة',
    page: 'engineering.html',
    icon: '💻',
    greeting: 'يا هلا في المهندس',
    electives: ['🧪 الكيمياء', '🧬 العلوم الحياتية', '🌍 علوم الأرض والبيئة'],
    majors: ['الهندسة بمختلف فروعها', 'تكنولوجيا المعلومات', 'علوم الحاسوب', 'الذكاء الاصطناعي']
  },
  health: {
    name: 'صحي',
    page: 'health.html',
    icon: '🏥',
    greeting: 'يا هلا بالصحي',
    electives: ['⚡ الفيزياء', '📐 الرياضيات', '🌍 علوم الأرض والبيئة'],
    majors: ['الطب', 'طب الأسنان', 'الصيدلة', 'التمريض', 'المختبرات الطبية']
  },
  humanities: {
    name: 'العلوم الإنسانية والاجتماعية',
    page: 'languages.html',
    icon: '📖',
    greeting: 'يا هلا فيك',
    electives: ['🧠 علم الاجتماع وعلم النفس', '💭 الفلسفة', '💰 ثقافة مالية', '🏛️ تاريخ', '🌏 جغرافيا'],
    majors: ['القانون', 'التربية', 'الشريعة والدراسات الإسلامية', 'علم النفس', 'اللغات']
  },
  business: {
    name: 'الأعمال',
    page: 'business.html',
    icon: '💼',
    greeting: 'يا هلا فيك',
    electives: ['🏛️ تاريخ', '🧠 علم الاجتماع وعلم النفس', '☪️ التربية الإسلامية', '🖊️ اللغة العربية تخصص', '💭 الفلسفة', '🌏 الجغرافيا'],
    majors: ['إدارة الأعمال', 'المحاسبة', 'التسويق', 'التمويل', 'نظم المعلومات الإدارية']
  }
};

let currentField = null;

function openEntryModal(fieldKey) {
  currentField = fieldKey;
  document.getElementById('entryModal').classList.add('show');
  showStep1();
}

function closeEntryModal() {
  document.getElementById('entryModal').classList.remove('show');
  currentField = null;
}

function showStep1() {
  const f = FIELDS[currentField];
  document.getElementById('entryContent').innerHTML = `
    <div class="entry-step">
      <span class="entry-field-icon">${f.icon}</span>
      <div class="entry-field-name">${f.name}</div>
      <div class="entry-question">🎯 شو المادة الاختيارية اللي اخترتها؟</div>
      <div class="entry-hint">هذي رح تكون مادتك الرابعة</div>
      <div class="entry-options">
        ${f.electives.map(e => `<div class="entry-opt" onclick="selectElective('${e}')">${e}</div>`).join('')}
      </div>
      <div class="entry-note">اختر المادة اللي اخترتها في المدرسة</div>
    </div>
  `;
}

let selectedElective = null;

function selectElective(elective) {
  selectedElective = elective;
  showStep2();
}

function showStep2() {
  const f = FIELDS[currentField];
  const container = document.getElementById('entryContent');
  container.innerHTML = `
    <div class="entry-step">
      <span class="entry-field-icon">${f.icon}</span>
      <div class="entry-field-name">${f.name}</div>
      <div style="font-size:0.8rem;color:var(--gold);margin-bottom:16px;opacity:0.7;">✅ ${selectedElective}</div>
      <div class="entry-question">🏫 شو حاب تدخل تخصص يا بطل؟</div>
      <div class="entry-hint">اختر تخصصك الجامعي المستقبالي</div>
      <div class="entry-options">
        ${f.majors.map(m => `<div class="entry-opt" onclick="selectMajor('${m}')">${m}</div>`).join('')}
      </div>
      <div class="entry-note">تقدر تغير المادة الاختيارية من داخل الصفحة لاحقاً</div>
    </div>
  `;
}

function selectMajor(major) {
  const f = FIELDS[currentField];
  const container = document.getElementById('entryContent');
  container.innerHTML = `
    <div class="entry-step">
      <div class="entry-loading">
        <div class="entry-spinner"></div>
        <div class="entry-loading-text">🤖 تجهيز صفحتك الشخصية...</div>
        <div class="entry-loading-sub">${f.greeting}</div>
      </div>
    </div>
  `;
  setTimeout(() => {
    const name = (currentProfile && currentProfile.username) || 'زائر';
    const params = new URLSearchParams({ elective: selectedElective, major, name });
    const year = document.body.dataset.year;
    window.location.href = f.page + '?' + params.toString();
  }, 1200);
}

// Allow ESC to close modal
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeEntryModal();
});
// Close on overlay click
document.getElementById('entryModal').addEventListener('click', function(e) {
  if (e.target === this) closeEntryModal();
});
</script>
<script src="../js/main.js"></script>

<!-- Profile Modal -->
<div id="profileModal" class="info-modal">
  <div class="info-modal-content profile-modal-content">
    <div class="profile-modal-header">
      <div style="position:relative;display:inline-block">
        <img id="modalAvatar" class="modal-avatar" src="" alt="">
        <button class="avatar-edit-btn" onclick="document.getElementById('avatarInput').click()">📷</button>
        <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadAvatar(event)">
      </div>
      <h3 id="modalName" class="modal-name"></h3>
      <span id="modalEmail" class="modal-email"></span>
    </div>
    <div class="profile-modal-body">
      <div class="profile-field">
        <label>اسم المستخدم</label>
        <div class="profile-field-row">
          <input type="text" id="usernameInput" class="profile-input" placeholder="أدخل اسمك" disabled>
          <button id="editUsernameBtn" class="profile-action-btn" onclick="toggleUsernameEdit()">✏️ تعديل</button>
        </div>
        <span id="usernameHint" class="profile-hint"></span>
      </div>
      <div class="profile-field">
        <label>رابط الصورة</label>
        <div class="profile-field-row">
          <input type="text" id="avatarUrlInput" class="profile-input ltr" placeholder="https://example.com/avatar.jpg" dir="ltr">
          <button class="profile-action-btn" onclick="updateAvatarUrl()">💾 حفظ</button>
        </div>
        <span class="profile-hint">أو الصق رابط صورة مباشر</span>
      </div>
    </div>
    <div class="profile-modal-footer">
      <button class="profile-logout-btn" onclick="logout()">🚪 تسجيل خروج</button>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script>
try { supabase = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey); } catch(e) { supabase = null; }

let currentProfile = null;
let isUsernameEditing = false;

(async function() {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      const { data: profile } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
      if (profile) {
        currentProfile = profile;
        const avatar = profile.avatar_url || session.user.user_metadata?.avatar_url || '';
        const name = profile.username || session.user.user_metadata?.full_name || session.user.email;
        const badge = document.getElementById('profileBadge');
        badge.style.display = 'flex';
        document.getElementById('profileBadgeAvatar').src = avatar;
      }
    }
  } catch (e) {
    // Supabase unreachable
  }
})();

function logout() {
  localStorage.removeItem('madrekjo_guest');
  if (supabase) supabase.auth.signOut();
  window.location.href = '../index.html';
}

function openProfileModal() {
  if (!currentProfile) return;
  const p = currentProfile;
  document.getElementById('modalAvatar').src = p.avatar_url || '';
  document.getElementById('modalName').textContent = p.username || '';
  document.getElementById('modalEmail').textContent = 'عضو مسجل';
  document.getElementById('usernameInput').value = p.username || '';
  document.getElementById('usernameInput').disabled = true;
  document.getElementById('avatarUrlInput').value = p.avatar_url || '';
  document.getElementById('editUsernameBtn').textContent = '✏️ تعديل';
  isUsernameEditing = false;
  const hint = document.getElementById('usernameHint');
  const lastChange = p.last_username_change;
  if (!lastChange) { hint.textContent = 'يمكنك تغيير اسمك الآن'; hint.style.color = 'var(--gold)'; }
  else {
    const daysSince = Math.floor((Date.now() - new Date(lastChange).getTime()) / (1000 * 60 * 60 * 24));
    if (daysSince >= 30) { hint.textContent = 'يمكنك تغيير اسمك الآن'; hint.style.color = 'var(--gold)'; }
    else { hint.textContent = `يمكنك تغيير اسمك بعد ${30 - daysSince} يوم`; hint.style.color = '#f87171';
      document.getElementById('usernameInput').disabled = true;
      document.getElementById('editUsernameBtn').textContent = '✏️ تعديل'; isUsernameEditing = false; }
  }
  document.getElementById('profileModal').classList.add('show');
}

function closeProfileModal() { document.getElementById('profileModal').classList.remove('show'); }

function toggleUsernameEdit() {
  const input = document.getElementById('usernameInput');
  if (isUsernameEditing) { saveUsername(); }
  else { input.disabled = false; input.focus(); document.getElementById('editUsernameBtn').textContent = '💾 حفظ'; isUsernameEditing = true; }
}

async function saveUsername() {
  const input = document.getElementById('usernameInput');
  const newName = input.value.trim();
  if (!newName || newName.length < 2) { alert('الاسم يجب أن يكون على الأقل حرفين'); return; }
  if (newName.length > 30) { alert('الاسم يجب أن لا يتجاوز 30 حرف'); return; }
  const lastChange = currentProfile?.last_username_change;
  if (lastChange) {
    const daysSince = Math.floor((Date.now() - new Date(lastChange).getTime()) / (1000 * 60 * 60 * 24));
    if (daysSince < 30) { alert(`يمكنك تغيير اسمك بعد ${30 - daysSince} يوم`); return; }
  }
  if (!supabase) return;
  const { error } = await supabase.from('profiles').update({ username: newName, last_username_change: new Date().toISOString() }).eq('id', currentProfile.id);
  if (!error) {
    currentProfile.username = newName; currentProfile.last_username_change = new Date().toISOString();
    document.getElementById('modalName').textContent = newName;
    input.disabled = true; document.getElementById('editUsernameBtn').textContent = '✏️ تعديل'; isUsernameEditing = false;
  }
}

async function updateAvatarUrl() {
  const url = document.getElementById('avatarUrlInput').value.trim();
  if (!url) { alert('الرجاء إدخال رابط الصورة'); return; }
  if (!supabase) return alert('مكتبة Supabase غير متوفرة');
  const { error } = await supabase.from('profiles').update({ avatar_url: url }).eq('id', currentProfile.id);
  if (!error) { currentProfile.avatar_url = url; document.getElementById('profileBadgeAvatar').src = url; document.getElementById('modalAvatar').src = url; }
}

async function uploadAvatar(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { alert('حجم الصورة يجب أن لا يتجاوز 2MB'); return; }
  if (!supabase) return alert('مكتبة Supabase غير متوفرة');
  const fileExt = file.name.split('.').pop();
  const fileName = `${currentProfile.id}/${Date.now()}.${fileExt}`;
  const { error: uploadError } = await supabase.storage.from('avatars').upload(fileName, file);
  if (uploadError) { alert('حدث خطأ في رفع الصورة'); return; }
  const { data: { publicUrl } } = supabase.storage.from('avatars').getPublicUrl(fileName);
  document.getElementById('avatarUrlInput').value = publicUrl;
  updateAvatarUrl();
}
</script>
</body>
