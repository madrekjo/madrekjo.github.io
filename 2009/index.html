<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختر حقل — مدارك جو 2009</title>
<meta name="google-adsense-account" content="ca-pub-3351421535309022">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مدارك جو">
<meta name="description" content="اختر حقل دراستك في جيل 2009 من منصة مدارك جو: العلوم والتكنولوجيا والهندسة، الصحي، الأعمال، أو العلوم الإنسانية — كل حقل بمواده وامتحاناته.">
<meta name="keywords" content="جيل 2009, اختيار الحقل, مسارات 2009, مدارك جو, منصة تعليمية">
<link rel="icon" type="image/jpeg" href="https://d.top4top.io/p_3816yfhp01.jpg">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
body { background: var(--deep); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body data-year="2009">

<div class="stars" id="starsContainer"></div>

<a href="../index.html" class="back-landing-btn">← العودة للصفحة الرئيسية</a>

<div class="field-select-page">
  <div class="field-select-title">👑 اختر حقل</div>
  <div class="field-select-sub">اختر تخصصك الدراسي لتدخل إلى منصة 2009</div>
  <div class="field-select-grid">
    <div class="field-select-card" onclick="openEntryModal('engineering')">
      <span class="icon">💻</span>
      <div class="name">العلوم والتكنولوجيا والهندسة</div>
      <div class="sub">يا هلا في المهندس</div>
    </div>
    <div class="field-select-card" onclick="openEntryModal('health')">
      <span class="icon">🏥</span>
      <div class="name">صحي</div>
      <div class="sub">يا هلا بالصحي</div>
    </div>
    <div class="field-select-card" onclick="openEntryModal('humanities')">
      <span class="icon">📖</span>
      <div class="name">العلوم الإنسانية والاجتماعية</div>
      <div class="sub">يا هلا فيك</div>
    </div>
    <div class="field-select-card" onclick="openEntryModal('business')">
      <span class="icon">💼</span>
      <div class="name">الأعمال</div>
      <div class="sub">يا هلا فيك</div>
    </div>
  </div>
</div>

<div class="entry-modal" id="entryModal">
  <div class="entry-modal-content" id="entryContent">
  </div>
</div>

<a href="https://www.instagram.com/madrekjo/" target="_blank" class="ig-floating" aria-label="Instagram">
  <img src="../assets/icons/instagram.png" class="ig-icon" width="38" height="38" alt="Instagram">
</a>

<script>
const FIELDS = {
  engineering: {
    name: 'العلوم والتكنولوجيا والهندسة',
    page: 'engineering.html',
    icon: '💻',
    greeting: 'يا هلا في المهندس',
    electives: ['🧪 الكيمياء', '🧬 العلوم الحياتية', '🌍 علوم الأرض والبيئة'],
    majors: ['الهندسة بمختلف فروعها', 'تكنولوجيا المعلومات', 'علوم الحاسوب', 'الذكاء الاصطناعي']
  },
  health: {
    name: 'صحي',
    page: 'health.html',
    icon: '🏥',
    greeting: 'يا هلا بالصحي',
    electives: ['⚡ الفيزياء', '📐 الرياضيات', '🌍 علوم الأرض والبيئة'],
    majors: ['الطب', 'طب الأسنان', 'الصيدلة', 'التمريض', 'المختبرات الطبية']
  },
  humanities: {
    name: 'العلوم الإنسانية والاجتماعية',
    page: 'languages.html',
    icon: '📖',
    greeting: 'يا هلا فيك',
    electives: ['🧠 علم الاجتماع وعلم النفس', '💭 الفلسفة', '💰 ثقافة مالية', '🏛️ تاريخ', '🌏 جغرافيا'],
    majors: ['القانون', 'التربية', 'الشريعة والدراسات الإسلامية', 'علم النفس', 'اللغات']
  },
  business: {
    name: 'الأعمال',
    page: 'business.html',
    icon: '💼',
    greeting: 'يا هلا فيك',
    electives: ['🏛️ تاريخ', '🧠 علم الاجتماع وعلم النفس', '☪️ التربية الإسلامية', '🖊️ اللغة العربية تخصص', '💭 الفلسفة', '🌏 الجغرافيا'],
    majors: ['إدارة الأعمال', 'المحاسبة', 'التسويق', 'التمويل', 'نظم المعلومات الإدارية']
  }
};

let currentField = null;

function openEntryModal(fieldKey) {
  currentField = fieldKey;
  document.getElementById('entryModal').classList.add('show');
  showStep1();
}

function closeEntryModal() {
  document.getElementById('entryModal').classList.remove('show');
  currentField = null;
}

function showStep1() {
  const f = FIELDS[currentField];
  document.getElementById('entryContent').innerHTML = `
    <div class="entry-step">
      <span class="entry-field-icon">${f.icon}</span>
      <div class="entry-field-name">${f.name}</div>
      <div class="entry-question">🎯 شو المادة الاختيارية اللي اخترتها؟</div>
      <div class="entry-hint">هذي رح تكون مادتك الرابعة</div>
      <div class="entry-options">
        ${f.electives.map(e => `<div class="entry-opt" onclick="selectElective('${e}')">${e}</div>`).join('')}
      </div>
      <div class="entry-note">اختر المادة اللي اخترتها في المدرسة</div>
    </div>
  `;
}

let selectedElective = null;

function selectElective(elective) {
  selectedElective = elective;
  showStep2();
}

function showStep2() {
  const f = FIELDS[currentField];
  const container = document.getElementById('entryContent');
  container.innerHTML = `
    <div class="entry-step">
      <span class="entry-field-icon">${f.icon}</span>
      <div class="entry-field-name">${f.name}</div>
      <div style="font-size:0.8rem;color:var(--gold);margin-bottom:16px;opacity:0.7;">✅ ${selectedElective}</div>
      <div class="entry-question">🏫 شو حاب تدخل تخصص يا بطل؟</div>
      <div class="entry-hint">اختر تخصصك الجامعي المستقبالي</div>
      <div class="entry-options">
        ${f.majors.map(m => `<div class="entry-opt" onclick="selectMajor('${m}')">${m}</div>`).join('')}
      </div>
      <div class="entry-note">تقدر تغير المادة الاختيارية من داخل الصفحة لاحقاً</div>
    </div>
  `;
}

function selectMajor(major) {
  const f = FIELDS[currentField];
  const container = document.getElementById('entryContent');
  container.innerHTML = `
    <div class="entry-step">
      <div class="entry-loading">
        <div class="entry-spinner"></div>
        <div class="entry-loading-text">🤖 تجهيز صفحتك الشخصية...</div>
        <div class="entry-loading-sub">${f.greeting}</div>
      </div>
    </div>
  `;
  setTimeout(() => {
    const name = 'زائر';
    const params = new URLSearchParams({ elective: selectedElective, major, name });
    const year = document.body.dataset.year;
    window.location.href = f.page + '?' + params.toString();
  }, 1200);
}

// Allow ESC to close modal
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeEntryModal();
});
// Close on overlay click
document.getElementById('entryModal').addEventListener('click', function(e) {
  if (e.target === this) closeEntryModal();
});
</script>
<script src="../js/main.js"></script>
</body>
</html>
