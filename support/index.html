    <script>
      (function () {
        try {
          var saved = localStorage.getItem("mdk:support:theme");
          var t;
          if (saved === "dark" || saved === "light") {
            t = saved;
          } else {
            t = localStorage.getItem("theme");
            var h = new Date().getHours();
            if (h >= 22 || h < 7) t = "sleep";
          }
          if (t === "dark" || t === "blue" || t === "pink" || t === "sleep") {
            document.documentElement.classList.add(t);
          }
        } catch (e) {
          /* تجاهل — الوضع الافتراضي فاتح */
        }
      })();
    </script>
