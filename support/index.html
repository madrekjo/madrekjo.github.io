<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>الدعم والمساعدة — مدارك جو</title>
<meta name="description" content="تواصل مع إدارة مدارك جو: للمسجّلين وللزوّار، من أي جهاز." />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0a0a0f; --card:#14141d; --line:#262634; --txt:#e9e9f0;
    --muted:#9a9ab0; --accent:#6d8bff; --accent2:#8a6dff; --ok:#34d399;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font-family:"Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; line-height:1.7;
  }
  a{color:var(--accent)}
  header{
    display:flex; align-items:center; gap:.6rem; padding:.9rem 1rem;
    border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(10,10,15,.9);
    backdrop-filter:blur(8px); z-index:5;
  }
  header .brand{font-weight:700; font-size:1.05rem}
  header .sp{margin-inline-start:auto}
  .btn{
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
    border:0; border-radius:10px; padding:.55rem 1rem; font:inherit; font-weight:600;
    cursor:pointer; transition:.15s; display:inline-flex; align-items:center; gap:.4rem;
  }
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.5; cursor:not-allowed}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--txt)}
  main{flex:1; width:100%; max-width:760px; margin:0 auto; padding:1.2rem 1rem 2rem}
  .title{display:flex; align-items:center; gap:.5rem; margin:.4rem 0 1rem}
  .title h1{font-size:1.35rem; margin:0}
  .sub{color:var(--muted); font-size:.9rem; margin:.2rem 0 1rem}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1rem}
  .field{display:block; margin-bottom:.7rem}
  .field label{display:block; font-size:.82rem; color:var(--muted); margin-bottom:.3rem}
  input[type=text],textarea{
    width:100%; background:#0f0f18; color:var(--txt); border:1px solid var(--line);
    border-radius:10px; padding:.6rem .7rem; font:inherit; resize:vertical;
  }
  input:focus,textarea:focus{outline:none; border-color:var(--accent)}
  .chips{display:flex; flex-wrap:wrap; gap:.4rem; margin:.2rem 0 1rem}
  .chip{background:#181826; border:1px solid var(--line); color:var(--txt); border-radius:999px;
    padding:.35rem .7rem; font-size:.78rem; cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .thread{display:flex; flex-direction:column; gap:.5rem; max-height:52vh; overflow-y:auto; padding:.3rem}
  .msg{padding:.6rem .8rem; border-radius:12px; font-size:.92rem; max-width:82%; white-space:pre-wrap; word-wrap:break-word}
  .msg.me{align-self:flex-start; background:linear-gradient(135deg,rgba(109,139,255,.25),rgba(138,109,255,.22)); border:1px solid rgba(109,139,255,.35)}
  .msg.them{align-self:flex-end; background:#1b1b28; border:1px solid var(--line)}
  .msg .meta{font-size:.7rem; color:var(--muted); margin-top:.25rem}
  .msg .tag{color:var(--accent); font-weight:700; font-size:.72rem}
  .empty{color:var(--muted); text-align:center; padding:1.4rem; font-size:.9rem}
  .composer{display:flex; gap:.5rem; margin-top:.8rem; align-items:flex-end}
  .composer textarea{flex:1; min-height:44px; max-height:140px}
  .convo{border:1px solid var(--line); border-radius:12px; margin-bottom:.7rem; overflow:hidden}
  .convo .head{display:flex; align-items:center; gap:.6rem; padding:.7rem .8rem; cursor:pointer; background:#16161f}
  .convo .head .nm{font-weight:600; font-size:.95rem}
  .convo .head .cnt{color:var(--muted); font-size:.78rem}
  .convo .head .new{margin-inline-start:auto; background:var(--accent); color:#fff; border-radius:999px; font-size:.68rem; padding:.1rem .5rem}
  .convo .body{padding:.7rem .8rem; border-top:1px solid var(--line)}
  .badge{font-size:.7rem; color:var(--muted)}
  .loading{color:var(--muted); text-align:center; padding:2rem}
  .note{font-size:.78rem; color:var(--muted); margin-top:.5rem}
  .ok{color:var(--ok)}
  footer{color:var(--muted); font-size:.78rem; text-align:center; padding:1rem; border-top:1px solid var(--line)}
  .hidden{display:none!important}
</style>
</head>
<body>
<header>
  <span class="brand">💬 الدعم والمساعدة</span>
  <span class="sp"></span>
  <a class="btn ghost" href="/">الرئيسية</a>
</header>

<main id="app">
  <div class="loading">جاري التحميل…</div>
</main>

<footer>
  منصّة مدارك جو — نساعدك بأي وقت. لا تشارك كلمات المرور أو بيانات حساسة.
</footer>

<script>
(function () {
  const SUPABASE_URL = "https://romocwtqzdnovfgtmwzb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_FxIiY1SHBKXkoByvKu0-Jg_msr2Qd45";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true },
  });

  const app = document.getElementById("app");
  const esc = (s) => String(s == null ? "" : s);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const ago = (iso) => {
    try {
      const d = new Date(iso);
      const s = Math.floor((Date.now() - d.getTime()) / 1000);
      if (s < 60) return "الآن";
      if (s < 3600) return `قبل ${Math.floor(s / 60)} دقيقة`;
      if (s < 86400) return `قبل ${Math.floor(s / 3600)} ساعة`;
      return `قبل ${Math.floor(s / 86400)} يوم`;
    } catch (e) { return ""; }
  };

  const SUGGESTED = [
    "أواجه مشكلة في الدخول بحسابي",
    "رمز الدعوة لا يعمل",
    "كيف أغيّر اسمي أو صورتي؟",
    "اريد حذف حسابي أو محتواي",
  ];

  function renderMessage(m, mine) {
    const box = el("div", "msg " + (mine ? "me" : "them"));
    if (!mine) {
      const t = el("div", "tag", "🛡️ رد الإدارة");
      box.appendChild(t);
    }
    const p = el("div", null, m.content || "");
    p.style.whiteSpace = "pre-wrap";
    box.appendChild(p);
    if (m.image_urls && m.image_urls.length) {
      const grid = el("div");
      grid.style.display = "flex"; grid.style.gap = ".3rem"; grid.style.flexWrap = "wrap"; grid.style.marginTop = ".3rem";
      m.image_urls.forEach((u) => {
        const a = el("a"); a.href = u; a.target = "_blank";
        const img = el("img"); img.src = u; img.loading = "lazy";
        img.style.width = "90px"; img.style.height = "90px"; img.style.objectFit = "cover"; img.style.borderRadius = "8px";
        a.appendChild(img); grid.appendChild(a);
      });
      box.appendChild(grid);
    }
    box.appendChild(el("div", "meta", ago(m.created_at)));
    return box;
  }

  // ---------------- GUEST ----------------
  function guestToken() {
    let t = null;
    try { t = localStorage.getItem("mdk:support:token"); } catch (e) {}
    if (!t) {
      t = (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + "-" + Math.random().toString(16).slice(2));
      try { localStorage.setItem("mdk:support:token", t); } catch (e) {}
    }
    return t;
  }

  async function renderGuest() {
    const token = guestToken();
    let name = ""; try { name = localStorage.getItem("mdk:support:name") || ""; } catch (e) {}
    let contact = ""; try { contact = localStorage.getItem("mdk:support:contact") || ""; } catch (e) {}

    app.innerHTML = "";
    const title = el("div", "title");
    title.appendChild(el("span", null, "🎫"));
    title.appendChild(el("h1", null, "تواصل مع الإدارة"));
    app.appendChild(title);
    app.appendChild(el("p", "sub", "أرسل رسالتك وسيصلنا الرد هنا. احفظ هذا الرابط/المتصفح لترى الرد لاحقاً."));

    const info = el("div", "card");
    const f1 = el("div", "field");
    f1.appendChild(el("label", null, "اسمك (اختياري)"));
    const inName = el("input"); inName.type = "text"; inName.value = name; inName.placeholder = "اكتب اسمك أو اتركه فارغاً";
    f1.appendChild(inName);
    const f2 = el("div", "field");
    f2.appendChild(el("label", null, "وسيلة تواصل (اختياري): إيميل / جوال / تيليجرام"));
    const inContact = el("input"); inContact.type = "text"; inContact.value = contact; inContact.placeholder = "مثلاً: name@email.com";
    f2.appendChild(inContact);
    info.appendChild(f1); info.appendChild(f2);
    const note = el("div", "note", "لديك حساب؟ ");
    const login = el("a", null, "سجّل الدخول"); login.href = "/login/";
    note.appendChild(login); note.appendChild(document.createTextNode(" لترى كل رسائلك بأي جهاز."));
    info.appendChild(note);
    app.appendChild(info);

    const chips = el("div", "chips");
    SUGGESTED.forEach((q) => {
      const c = el("button", "chip", q);
      c.onclick = () => send(q);
      chips.appendChild(c);
    });
    app.appendChild(chips);

    const thread = el("div", "thread"); thread.id = "thread";
    app.appendChild(thread);

    const comp = el("div", "composer");
    const ta = el("textarea"); ta.placeholder = "اكتب رسالتك هنا…"; ta.rows = 1;
    const sendBtn = el("button", "btn", "إرسال");
    comp.appendChild(ta); comp.appendChild(sendBtn);
    app.appendChild(comp);
    const hint = el("div", "note", "اضغط Enter للإرسال · Shift+Enter لسطر جديد");
    app.appendChild(hint);

    let lastSeen = 0; try { lastSeen = Number(localStorage.getItem("mdk:support:seen") || 0); } catch (e) {}

    async function load(scroll) {
      const { data, error } = await sb.rpc("support_guest_fetch", { p_token: token });
      if (error) { thread.innerHTML = ""; thread.appendChild(el("div", "empty", "تعذّر تحميل الرسائل: " + error.message)); return; }
      thread.innerHTML = "";
      if (!data || !data.length) {
        thread.appendChild(el("div", "empty", "لا توجد رسائل بعد — اكتب رسالتك وسنرد عليك."));
      } else {
        data.forEach((m) => thread.appendChild(renderMessage(m, !m.from_admin)));
        const last = data[data.length - 1];
        if (scroll) thread.scrollTop = thread.scrollHeight;
        if (last && new Date(last.created_at).getTime() > lastSeen) {
          lastSeen = new Date(last.created_at).getTime();
          try { localStorage.setItem("mdk:support:seen", String(lastSeen)); } catch (e) {}
        }
      }
    }

    async function send(preset) {
      const text = (preset != null ? preset : ta.value).trim();
      if (!text) return;
      name = inName.value.trim(); contact = inContact.value.trim();
      try { localStorage.setItem("mdk:support:name", name); localStorage.setItem("mdk:support:contact", contact); } catch (e) {}
      sendBtn.disabled = true;
      const { error } = await sb.rpc("support_guest_send", {
        p_token: token, p_name: name || null, p_contact: contact || null, p_content: text,
      });
      sendBtn.disabled = false;
      if (error) { alert("تعذّر الإرسال: " + error.message); return; }
      ta.value = "";
      await load(true);
    }

    sendBtn.onclick = () => send();
    ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });

    await load(true);
    setInterval(() => load(false), 10000);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(false); });
  }

  // ---------------- LOGGED-IN USER ----------------
  async function renderUser(session) {
    const uid = session.user.id;
    app.innerHTML = "";
    const title = el("div", "title");
    title.appendChild(el("span", null, "💬"));
    title.appendChild(el("h1", null, "تواصل مع الإدارة"));
    app.appendChild(title);
    const who = (session.user.user_metadata && (session.user.user_metadata.full_name || session.user.user_metadata.name)) || session.user.email || "";
    app.appendChild(el("p", "sub", "مسجّل الدخول" + (who ? " باسم: " + who : "") + " — وسنرد عليك هنا."));

    const chips = el("div", "chips");
    SUGGESTED.forEach((q) => { const c = el("button", "chip", q); c.onclick = () => send(q); chips.appendChild(c); });
    app.appendChild(chips);

    const thread = el("div", "thread"); app.appendChild(thread);
    const comp = el("div", "composer");
    const ta = el("textarea"); ta.placeholder = "اكتب رسالتك هنا…"; ta.rows = 1;
    const sendBtn = el("button", "btn", "إرسال");
    comp.appendChild(ta); comp.appendChild(sendBtn); app.appendChild(comp);
    app.appendChild(el("div", "note", "اضغط Enter للإرسال · Shift+Enter لسطر جديد"));

    let loadedOnce = false;
    async function load(scroll) {
      const { data, error } = await sb.from("support_messages")
        .select("id,user_id,sender_id,content,image_urls,is_read,created_at")
        .eq("user_id", uid).order("created_at", { ascending: true }).limit(300);
      if (error) { if (!loadedOnce) { thread.innerHTML = ""; thread.appendChild(el("div", "empty", "تعذّر التحميل: " + error.message)); } return; }
      thread.innerHTML = "";
      if (!data || !data.length) thread.appendChild(el("div", "empty", "لا توجد رسائل بعد — اكتب رسالتك وسنرد عليك."));
      else {
        data.forEach((m) => thread.appendChild(renderMessage(m, m.sender_id === uid)));
        if (scroll) thread.scrollTop = thread.scrollHeight;
        const hasNew = data.some((m) => m.sender_id !== uid && !m.is_read);
        if (hasNew) { try { await sb.from("support_messages").update({ is_read: true }).eq("user_id", uid).neq("sender_id", uid).eq("is_read", false); } catch (e) {} }
      }
      loadedOnce = true;
    }

    async function send(preset) {
      const text = (preset != null ? preset : ta.value).trim();
      if (!text) return;
      sendBtn.disabled = true;
      const { error } = await sb.from("support_messages").insert({ user_id: uid, sender_id: uid, content: text });
      sendBtn.disabled = false;
      if (error) { alert("تعذّر الإرسال: " + error.message); return; }
      ta.value = "";
      await load(true);
    }

    sendBtn.onclick = () => send();
    ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });

    await load(true);
    setInterval(() => load(false), 10000);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(false); });
  }

  // ---------------- STAFF ----------------
  async function renderStaff(session) {
    const uid = session.user.id;
    app.innerHTML = "";
    const title = el("div", "title");
    title.appendChild(el("span", null, "🛡️"));
    title.appendChild(el("h1", null, "رسائل الدعم"));
    const rf = el("button", "btn ghost", "تحديث"); rf.style.marginInlineStart = "auto";
    title.appendChild(rf);
    app.appendChild(title);
    app.appendChild(el("p", "sub", "الرد يصل للمسجّل داخل حسابه، وللزائر في نفس متصفحه."));

    const listWrap = el("div"); app.appendChild(listWrap);
    const profiles = {};

    rf.onclick = () => load(false);

    async function load() {
      const { data, error } = await sb.from("support_messages")
        .select("id,user_id,sender_id,guest_token,guest_name,guest_contact,content,image_urls,is_read,created_at")
        .order("created_at", { ascending: false }).limit(400);
      if (error) { listWrap.innerHTML = ""; listWrap.appendChild(el("div", "empty", "تعذّر التحميل: " + error.message)); return; }

      const groups = {};
      (data || []).forEach((m) => {
        const key = m.user_id || ("g:" + m.guest_token);
        if (!groups[key]) groups[key] = { key, user_id: m.user_id, guest_token: m.user_id ? null : m.guest_token, name: null, contact: null, msgs: [] };
        groups[key].msgs.push(m);
        if (!m.user_id) { groups[key].name = m.guest_name || groups[key].name; groups[key].contact = m.guest_contact || groups[key].contact; }
      });

      const userIds = Object.values(groups).map((g) => g.user_id).filter(Boolean);
      if (userIds.length) {
        const { data: profs } = await sb.from("profiles").select("user_id,full_name,avatar_url").in("user_id", userIds);
        (profs || []).forEach((p) => { profiles[p.user_id] = p; });
      }

      const keys = Object.keys(groups).sort((a, b) => {
        const la = groups[a].msgs[0]?.created_at || "", lb = groups[b].msgs[0]?.created_at || "";
        return new Date(lb) - new Date(la);
      });

      listWrap.innerHTML = "";
      if (!keys.length) { listWrap.appendChild(el("div", "empty", "لا توجد رسائل بعد")); return; }

      keys.forEach((k) => {
        const g = groups[k];
        const userMsgs = g.msgs.slice().reverse();
        const unread = g.msgs.filter((m) => !m.is_read && (m.user_id ? m.sender_id === m.user_id : m.sender_id === null)).length;
        const p = g.user_id ? profiles[g.user_id] : null;
        const dispName = g.user_id ? ((p && p.full_name) || "مستخدم") : (g.name || "زائر");

        const convo = el("div", "convo");
        const head = el("div", "head");
        const nm = el("div", "nm", dispName + (g.user_id ? "" : " (زائر)"));
        head.appendChild(nm);
        const cnt = el("div", "cnt", g.msgs.length + " رسالة");
        head.appendChild(cnt);
        if (unread) { const b = el("span", "new", unread + " جديد"); head.appendChild(b); }
        convo.appendChild(head);

        const body = el("div", "body hidden");
        if (!g.user_id && g.contact) body.appendChild(el("div", "badge", "وسيلة تواصل: " + g.contact));
        const thread = el("div", "thread");
        userMsgs.forEach((m) => thread.appendChild(renderMessage(m, !(m.user_id ? m.sender_id === m.user_id : m.sender_id === null))));
        body.appendChild(thread);

        const comp = el("div", "composer");
        const ta = el("textarea"); ta.placeholder = "اكتب رد الإدارة…"; ta.rows = 1;
        const sendBtn = el("button", "btn", "رد");
        comp.appendChild(ta); comp.appendChild(sendBtn); body.appendChild(comp);

        sendBtn.onclick = async () => {
          const text = ta.value.trim(); if (!text) return;
          sendBtn.disabled = true;
          const row = { user_id: g.user_id || null, sender_id: uid, content: text, guest_token: g.guest_token || null };
          const { error } = await sb.from("support_messages").insert(row);
          sendBtn.disabled = false;
          if (error) { alert("تعذّر الرد: " + error.message); return; }
          ta.value = "";
          if (g.user_id) { try { await sb.from("notifications").insert({ user_id: g.user_id, actor_id: uid, type: "support_reply" }); } catch (e) {} }
          load();
        };
        ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendBtn.click(); } });

        head.onclick = async () => {
          const opening = body.classList.contains("hidden");
          body.classList.toggle("hidden");
          if (opening && unread) {
            try {
              if (g.user_id) await sb.from("support_messages").update({ is_read: true }).eq("user_id", g.user_id).eq("is_read", false);
              else await sb.from("support_messages").update({ is_read: true }).eq("guest_token", g.guest_token).eq("is_read", false);
            } catch (e) {}
          }
        };

        convo.appendChild(body);
        listWrap.appendChild(convo);
      });
    }

    await load();
    setInterval(() => load(), 12000);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
  }

  // ---------------- BOOT ----------------
  (async function boot() {
    try {
      const { data } = await sb.auth.getSession();
      const session = data && data.session;
      if (!session) { await renderGuest(); return; }
      const { data: isAdmin } = await sb.rpc("support_is_admin");
      if (isAdmin === true) await renderStaff(session);
      else await renderUser(session);
    } catch (e) {
      app.innerHTML = "";
      const d = el("div", "empty", "حدث خطأ في التحميل. حدّث الصفحة.");
      app.appendChild(d);
    }
  })();
})();
</script>
</body>
</html>
