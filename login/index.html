<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0a0f">
<title>تسجيل الدخول — مدارك جو</title>
<meta property="og:title" content="تسجيل الدخول — مدارك جو">
<meta property="og:description" content="الدخول الموحد لمنصة مدارك جو — حساب واحد يفتح كل الأقسام.">
<meta property="og:site_name" content="مدارك جو">
<meta property="og:locale" content="ar_AR">
<meta property="og:url" content="https://madrekjo.study/login/">
<link rel="canonical" href="https://madrekjo.study/login/">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/images/logo.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:'Tajawal','Cairo',sans-serif;
    background:#0a0a0f;
    background-image:
      radial-gradient(1000px 500px at 85% -5%, rgba(124,58,237,.22), transparent 60%),
      radial-gradient(800px 500px at 10% 110%, rgba(56,189,248,.14), transparent 60%),
      radial-gradient(500px 300px at 50% 50%, rgba(168,85,247,.06), transparent 70%);
    color:#f5f3ff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }
  .card {
    width:100%;
    max-width:400px;
    background:rgba(20,18,36,.72);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:32px 26px 26px;
    text-align:center;
    box-shadow:0 24px 70px rgba(0,0,0,.5);
    backdrop-filter:blur(12px);
  }
  .logo-text { font-family:'Cairo',sans-serif; font-weight:900; font-size:26px; }
  .logo-text .jo { color:#8b5cf6; }
  .subtitle { margin-top:4px; font-size:13px; color:#a5b4d0; }
  .badge { display:inline-block; margin-top:14px; padding:3px 12px; border-radius:999px; font-size:11px; font-weight:700; color:#c4b5fd; background:rgba(139,92,246,.14); border:1px solid rgba(139,92,246,.35); }
  .title { margin-top:20px; font-size:19px; font-weight:800; }
  .desc { margin-top:8px; font-size:13.5px; line-height:1.9; color:#a5b4d0; }
  .btn-google {
    display:flex; align-items:center; justify-content:center; gap:12px;
    width:100%; margin-top:24px; padding:13px 16px;
    border:none; border-radius:14px; cursor:pointer;
    background:#ffffff; color:#1c1c28; font-family:'Tajawal',sans-serif;
    font-size:15px; font-weight:700; text-decoration:none;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .btn-google:hover { transform:translateY(-1px); box-shadow:0 14px 34px rgba(0,0,0,.45); }
  .btn-google:active { transform:translateY(0); }
  .btn-google svg { width:20px; height:20px; flex-shrink:0; }
  .btn-ghost {
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    margin-top:12px; padding:9px 18px;
    border:1px solid rgba(255,255,255,.16); border-radius:12px;
    background:transparent; color:#d7c9ff; font-family:'Tajawal',sans-serif;
    font-size:13px; font-weight:700; text-decoration:none; cursor:pointer;
    transition:background .15s ease;
  }
  .btn-ghost:hover { background:rgba(139,92,246,.12); }
  .status { margin-top:16px; font-size:13px; color:#a5b4d0; line-height:1.8; }
  .error { margin-top:14px; padding:11px 14px; border-radius:12px; font-size:12.5px; line-height:1.8; color:#fecaca; background:rgba(220,38,38,.12); border:1px solid rgba(248,113,113,.3); text-align:right; }
  .spinner {
    margin:18px auto 0; width:30px; height:30px; border-radius:50%;
    border:3px solid rgba(139,92,246,.25); border-top-color:#8b5cf6;
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .foot { margin-top:26px; font-size:12px; color:#6c7694; }
  .foot a { color:#a78bfa; text-decoration:none; }
  .foot a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo-text">مدارك <span class="jo">جو</span></div>
    <p class="subtitle">أول منصة تعليمية من صنع طالب</p>
    <span class="badge">الدخول الموحّد</span>

    <div id="body-wrap">
      <!-- يتم تعبئته ديناميكياً حسب الحالة -->
    </div>
  </div>
  <p class="foot" id="foot">
    <a href="/">العودة للرئيسية</a> · <a href="/chat/">الدردشة</a> · <a href="/achievement/">الإنجاز</a>
  </p>

<script>
(function () {
  "use strict";

  const SSO_BASE = "https://madrekjo-sso.madrekjo.workers.dev";
  const STORAGE_KEY = "mdk:sso:session";

  // الأقسام النشطة في الدخول الموحد (القيم عامة قابلة للنشر).
  const SECTIONS = [
    { key: "chat", url: "https://romocwtqzdnovfgtmwzb.supabase.co",
      anon: "sb_publishable_FxIiY1SHBKXkoByvKu0-Jg_msr2Qd45" },
    { key: "achievement", url: "https://itflhfhsfzrdfpxvlzrv.supabase.co",
      anon: "sb_publishable_3mypt4J1F0sG5RD6oTSZZg_6PNgwoyY" },
    { key: "sutur", url: "https://cfwnarueaparjbetagpi.supabase.co",
      anon: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmd25hcnVlYXBhcmpiZXRhZ3BpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzQ5MTQsImV4cCI6MjEwNDU1MDkxNH0.a96Oho0lpnX2Dtpa2q52m8BH1j_1-jr1ws95ET-aIqU" },
    { key: "anon", url: "https://jmucsccdxxizvqtkyieq.supabase.co",
      anon: "sb_publishable_9z430osiEJbuJ2vaENWixw_hHCUGb0L" },
    // أجر وثواب والتلاوات يتشاركان مشروع Supabase واحد.
    { key: "ajr", url: "https://njdvogvquzofnqqwyvyl.supabase.co",
      anon: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qZHZvZ3ZxdXpvZm5xcXd5dnlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxOTIyODQsImV4cCI6MjEwMzc2ODI4NH0.a0zbP1xm8rFuoTFSvbscdWo7HPZR2a9Dq3DEtZf_ua4" },
    { key: "talaawat", url: "https://njdvogvquzofnqqwyvyl.supabase.co",
      anon: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qZHZvZ3ZxdXpvZm5xcXd5dnlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxOTIyODQsImV4cCI6MjEwMzc2ODI4NH0.a0zbP1xm8rFuoTFSvbscdWo7HPZR2a9Dq3DEtZf_ua4" }
  ];

  function el(tag, props, children) {
    const n = document.createElement(tag);
    if (props) for (const k in props) {
      if (k === "className") n.className = props[k];
      else if (k === "html") n.innerHTML = props[k];
      else if (k.startsWith("on") && typeof props[k] === "function") n.addEventListener(k.slice(2).toLowerCase(), props[k]);
      else n.setAttribute(k, props[k]);
    }
    (children || []).forEach(function (c) {
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }

  const GOOGLE_SVG = '<svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C39.5 36.3 44 31.5 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>';

  function card() { return document.getElementById("card"); }
  function wrap() { return document.getElementById("body-wrap"); }

  function qp(name) {
    return new URLSearchParams(window.location.search).get(name) || "";
  }

  function readShared() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); }
    catch (e) { return null; }
  }
  function writeShared(payload) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch (e) {}
  }

  function loginHref(target) {
    return SSO_BASE + "/login?target=" + encodeURIComponent(target || "/");
  }

  function renderIdle() {
    var from = qp("from") || "/";
    var existing = readShared();
    wrap().innerHTML = "";

    var titleEl = el("p", { className: "title" }, [existing ? "أهلاً بعودتك" : "تسجيل الدخول"]);
    var descEl = el("p", { className: "desc" }, [
      existing
        ? "أنت مسجّل دخولك بالفعل عبر الدخول الموحّد — تابع الآن أو بدّل الحساب."
        : "حساب واحد عبر Google يفتح كل أقسام المنصة: الدردشة، الإنجاز، بين السطور، والمزيد."
    ]);
    wrap().appendChild(titleEl);
    wrap().appendChild(descEl);

    if (existing) {
      var goBtn = el("a", { className: "btn-ghost", href: from }, ["متابعة إلى القسم"]);
      wrap().appendChild(goBtn);
    }

    var googleBtn = el("a", {
        className: "btn-google", href: loginHref(from),
        html: GOOGLE_SVG + "<span>تسجيل الدخول بحساب Google" + (existing ? " — حساب آخر" : "") + "</span>"
      });
    googleBtn.addEventListener("click", function (e) {
      // نربط الدخول بمقصدِ القادم عبر target في الرابط أعلاه.
    });
    wrap().appendChild(googleBtn);

    if (existing) {
      var exitBtn = el("button", {
          className: "btn-ghost",
          onClick: function () {
            try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
            window.location.replace("/login/?from=" + encodeURIComponent(from));
          }
        }, ["تسجيل الخروج من هذا الجهاز"]);
      wrap().appendChild(exitBtn);
    }
  }

  function renderBanned() {
    wrap().innerHTML = "";
    wrap().appendChild(el("p", { className: "title" }, ["حسابك محظور"]));
    wrap().appendChild(el("p", { className: "desc" }, [
      "تم تعليق هذا الحساب من دخول المنصة على جميع الأقسام. إذا كنتَ تعتقد أنّ هذا خطأ، تواصل مع إدارة المنصة."
    ]));
    wrap().appendChild(el("button", {
      className: "btn-ghost",
      onClick: function () {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        window.location.replace("/");
      }
    }, ["العودة إلى الرئيسية"]));
  }

  function renderError(msg) {
    wrap().innerHTML = "";
    wrap().appendChild(el("div", { className: "error" }, [msg]));
    wrap().appendChild(el("a", { className: "btn-ghost", href: "/login/" }, ["إعادة المحاولة"]));
  }

  function renderWorking(label) {
    wrap().innerHTML = "";
    wrap().appendChild(el("p", { className: "status" }, [label]));
    wrap().appendChild(el("div", { className: "spinner" }));
  }

  async function consume(ticket) {
    const res = await fetch(SSO_BASE + "/session?ticket=" + encodeURIComponent(ticket), {
      headers: { Accept: "application/json" }
    });
    if (!res.ok) {
      let detail = "";
      try { detail = (await res.text()).slice(0, 200); } catch (e) {}
      throw new Error("فشل التحقق من التذكرة (" + res.status + ") " + detail);
    }
    return await res.json();
  }

  async function persistSections(payload) {
    const tasks = [];
    for (const s of SECTIONS) {
      const sess = payload && payload[s.key];
      if (!sess || !sess.access_token || !sess.refresh_token) continue;
      tasks.push((async function () {
        try {
          const c = window.supabase && window.supabase.createClient(s.url, s.anon);
          if (!c) return;
          await c.auth.setSession({
            access_token: sess.access_token,
            refresh_token: sess.refresh_token,
          });
        } catch (e) { console.warn("[login] persist " + s.key + " failed", e); }
      })());
    }
    await Promise.all(tasks);
  }

  function handleTicket(ticket) {
    // وضع النافذة المنبثقة (Popup): chat/achievement تفعّلان التذاكر بأنفسهما.
    if (window.opener && !window.opener.closed) {
      renderWorking("تم تسجيل الدخول، جاري الإغلاق...");
      const targetOrigin = window.location.origin;
      try { window.opener.postMessage({ type: "GOOGLE_LOGIN_SUCCESS", ticket: ticket }, targetOrigin); } catch (e) {}
      let closed = false;
      function closeNow() { if (!closed) { closed = true; window.close(); } }
      function onMsg(ev) {
        if (ev.origin !== targetOrigin) return;
        if (ev.source !== window.opener) return;
        if (ev.data && ev.data.type === "GOOGLE_LOGIN_POPUP_CLOSE") {
          window.removeEventListener("message", onMsg);
          closeNow();
        }
      }
      window.addEventListener("message", onMsg);
      window.setTimeout(closeNow, 8000);
      return;
    }

    renderWorking("جارٍ إنشاء جلساتك الموحّدة...");
    consume(ticket).then(function (payload) {
      writeShared(payload || {});
      return persistSections(payload || {}).then(function () { return payload; });
    }).then(function (payload) {
      renderWorking("تم الدخول، جارٍ التحويل...");
      const dest = (payload && payload.target) || qp("from") || "/";
      window.location.replace(dest);
    }).catch(function (err) {
      console.error("[login] consume failed", err);
      renderError("تعذّر إكمال تسجيل الدخول: " + (err instanceof Error ? err.message : "خطأ غير متوقع") + ". أعد المحاولة من صفحة الدخول.");
    });
  }

  function main() {
    const ticket = qp("ticket");
    if (ticket) {
      handleTicket(ticket);
      return;
    }
    if (qp("banned") === "1") {
      renderBanned();
      return;
    }
    renderIdle();
  }

  document.addEventListener("DOMContentLoaded", main);
})();
</script>
</body>
</html>
