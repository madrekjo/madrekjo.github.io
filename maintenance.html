<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>هذا القسم قيد الصيانة — مدارك جو</title>
    <meta name="robots" content="noindex,nofollow">
    <style>
      :root {
        --bg: #0b1220;
        --card: #121b2e;
        --line: #22304c;
        --text: #e8eefc;
        --muted: #93a4c4;
        --accent: #f5a623;
        --green: #2fbf71;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, "Segoe UI", Tahoma, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 520px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 40px 32px;
        text-align: center;
      }
      .icon {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        background: rgba(245, 166, 35, 0.12);
        border: 1px solid rgba(245, 166, 35, 0.35);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        margin-bottom: 20px;
      }
      h1 { font-size: 22px; margin-bottom: 8px; }
      .section-name {
        color: var(--accent);
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 14px;
        display: block;
      }
      p { color: var(--muted); font-size: 15px; line-height: 1.9; margin-bottom: 8px; }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
        padding: 12px 24px;
        border-radius: 12px;
        background: var(--accent);
        color: #1a1405;
        font-weight: 700;
        text-decoration: none;
        border: none;
        cursor: pointer;
      }
      .btn:hover { filter: brightness(1.08); }
      .btn.ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
        margin-inline-start: 8px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 18px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(47, 191, 113, 0.1);
        border: 1px solid rgba(47, 191, 113, 0.35);
        color: var(--green);
        font-size: 13px;
      }
      .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🛠️</div>
      <span class="section-name" id="sectionName">هذا القسم</span>
      <div class="status"><span class="dot"></span> قيد الصيانة — سيصل قريباً</div>
      <h1>القسم غير متاح حالياً</h1>
      <p>
        هذا القسم لم يُربط بعد بنظام الدخول الموحد الجديد للمنصة، ولذلك تم
        إغلاقه مؤقتاً لحين ربطه وفتحه أمام الجميع.
      </p>
      <p>
        شكراً لصبرك — سنُعلن فور فتحه.
      </p>
      <a class="btn" href="/">الرجوع للرئيسية</a>
      <a class="btn ghost" href="/chat/">تصفح الدردشة</a>
    </div>
    <script>
      (function () {
        try {
          var keys = {
            chat: "الدردشة",
            achievement: "الإنجاز",
            anon: "أنا مجهول",
            sutur: "بين السطور",
            ask: "اكتب سؤالك",
            ajr: "أجر وثواب",
            talaawat: "التلاوات",
            teacherFiles: "ملفات المعلمين",
          };
          var name = new URLSearchParams(window.location.search).get("section") || "";
          var label = keys[name] || name || "هذا القسم";
          document.getElementById("sectionName").textContent = label;
        } catch (e) {}
      })();
    </script>
  </body>
</html>
