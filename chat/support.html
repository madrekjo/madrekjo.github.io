    <!-- مطابقة ثيم الدردشة قبل أول رسم (منع وميض الثيم الفاتح):
         نفس منطق ThemeContext — الثيم المحفوظ + وضع النوم الليلي 10م→7ص. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var h = new Date().getHours();
          if (h >= 22 || h < 7) t = "sleep";
          if (t === "dark" || t === "blue" || t === "pink" || t === "sleep") {
            document.documentElement.classList.add(t);
          }
        } catch (e) {
          /* تجاهل — الوضع الافتراضي فاتح */
        }
      })();
    </script>
