    <script>
      (function(){
        // إعادة التحميل عند العودة من BFCache (Back-Forward Cache)
        // BFCache يبقي الصفحة القديمة حية مع WebSocket مقطوع وقفل Auth عالق —
        // إعادة التحميل تكسر القفل العالق وتعطي جلسة نظيفة.
        window.addEventListener('pageshow', function(event) {
          if (event.persisted) {
            console.warn('[chat-bfcache] restored from bfcache, reloading for clean session');
            location.reload();
          }
        });
      })();
    </script>
    <script>
      (function(){
        var EXPECTED = "index-DhnL823n.js";
        var scripts = document.querySelectorAll('script[type="module"]');
        for (var i = 0; i < scripts.length; i++) {
          if (scripts[i].src && scripts[i].src.indexOf("/chat/") !== -1) {
            if (scripts[i].src.indexOf(EXPECTED) === -1) {
              console.warn("[chat-refresh] stale build detected, clearing cache and reloading");
              if ("serviceWorker" in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for (var j = 0; j < regs.length; j++) { regs[j].unregister(); }
                  caches.keys().then(function(names) {
                    return Promise.all(names.map(function(n) { return caches.delete(n); }));
                  }).then(function() { location.reload(true); });
                });
              } else {
                location.reload(true);
              }
              return;
            }
            break;
          }
        }
      })();
    </script>
