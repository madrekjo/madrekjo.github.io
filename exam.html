<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار — مدارك جو</title>
<link rel="icon" type="image/jpeg" href="https://d.top4top.io/p_3816yfhp01.jpg">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root { --a: #FFD700; --a-dim: rgba(255,215,0,0.1); --a-border: rgba(255,215,0,0.25); --deep: #0a0a0f; --surface: #111118; --surface2: #1a1a24; --text: #f0f0f5; --muted: #888899; }
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Cairo', sans-serif;
  background: var(--deep);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.exam-wrap {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
}
.exam-header {
  text-align: center;
  margin-bottom: 32px;
}
.exam-subject {
  font-family: 'Tajawal', sans-serif;
  font-size: 1.6rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--a), #FFF3B0, #B8860B);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.exam-semester {
  font-size: 0.85rem;
  color: var(--muted);
  margin-top: 4px;
}
.progress-bar {
  width: 100%;
  height: 4px;
  background: var(--surface2);
  border-radius: 4px;
  margin: 20px 0 0;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--a), #FFF3B0);
  border-radius: 4px;
  transition: width 0.4s ease;
  width: 0%;
}
.progress-text {
  font-size: 0.78rem;
  color: var(--muted);
  margin-top: 8px;
  text-align: left;
}
.question-card {
  background: var(--surface);
  border: 1px solid var(--a-border);
  border-radius: 20px;
  padding: 32px 28px 24px;
  animation: qFade 0.35s ease both;
}
@keyframes qFade {
  from { opacity:0; transform: translateY(16px); }
  to { opacity:1; transform: translateY(0); }
}
.question-num {
  font-size: 0.78rem;
  color: var(--a);
  font-weight: 700;
  margin-bottom: 12px;
}
.question-text {
  font-family: 'Tajawal', sans-serif;
  font-size: 1.2rem;
  font-weight: 600;
  line-height: 1.7;
  margin-bottom: 24px;
  min-height: 3em;
}
.options-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.option-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--surface2);
  border: 2px solid transparent;
  border-radius: 14px;
  padding: 14px 18px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
  font-family: 'Cairo', sans-serif;
  font-size: 1rem;
  color: var(--text);
  text-align: right;
  width: 100%;
  position: relative;
}
.option-btn:hover {
  border-color: rgba(255,215,0,0.3);
  background: rgba(255,215,0,0.05);
  transform: translateX(-4px);
}
.option-circle {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid var(--muted);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s;
  position: relative;
}
.option-circle::after {
  content: '';
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--a);
  transform: scale(0);
  transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
.option-btn.selected {
  border-color: var(--a);
  background: var(--a-dim);
  color: var(--a);
}
.option-btn.selected .option-circle {
  border-color: var(--a);
}
.option-btn.selected .option-circle::after {
  transform: scale(1);
}
.option-btn.correct {
  border-color: #4caf50;
  background: rgba(76,175,80,0.1);
  color: #81c784;
}
.option-btn.correct .option-circle { border-color: #4caf50; }
.option-btn.correct .option-circle::after { background: #4caf50; transform: scale(1); }
.option-btn.wrong {
  border-color: #f44336;
  background: rgba(244,67,54,0.1);
  color: #ef9a9a;
}
.option-btn.wrong .option-circle { border-color: #f44336; }
.option-btn.wrong .option-circle::after { background: #f44336; transform: scale(1); }
.option-btn.disabled { pointer-events: none; }
.option-label {
  font-weight: 700;
  color: var(--muted);
  font-size: 0.85rem;
  flex-shrink: 0;
  width: 20px;
}
.result-card {
  display: none;
  background: var(--surface);
  border: 1px solid var(--a-border);
  border-radius: 20px;
  padding: 40px 28px;
  text-align: center;
  animation: qFade 0.5s ease both;
}
.result-icon { font-size: 4rem; margin-bottom: 12px; }
.result-score {
  font-family: 'Tajawal', sans-serif;
  font-size: 3rem;
  font-weight: 900;
  background: linear-gradient(135deg, var(--a), #FFF3B0);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.result-label {
  font-size: 1rem;
  color: var(--muted);
  margin: 8px 0 20px;
}
.result-detail {
  font-size: 0.88rem;
  color: var(--muted);
  line-height: 1.8;
}
.result-again {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 24px;
  background: var(--a-dim);
  border: 1px solid var(--a-border);
  color: var(--a);
  padding: 12px 28px;
  border-radius: 50px;
  font-family: 'Cairo', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.result-again:hover { background: rgba(255,215,0,0.2); }
.empty-state {
  text-align: center;
  padding: 60px 20px;
}
.empty-state .icon { font-size: 4rem; margin-bottom: 16px; }
.empty-state h3 { font-family: 'Tajawal', sans-serif; font-size: 1.4rem; color: var(--text); margin-bottom: 8px; }
.empty-state p { color: var(--muted); font-size: 0.9rem; }
@media (max-width: 500px) {
  .question-card { padding: 24px 16px 20px; }
  .question-text { font-size: 1.05rem; }
  .option-btn { padding: 12px 14px; font-size: 0.9rem; }
  .exam-subject { font-size: 1.3rem; }
}
</style>
</head>

      const pct = ((idx + 1) / total) * 100;
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressText').textContent = (idx + 1) + ' / ' + total + ' (' + item.subject + ' - ' + item.semester + ')';
      answered = false;

      let html = '<div class="question-card" id="qCard">';
      html += '<div class="question-num">سؤال ' + (idx + 1) + ' من مادة: ' + item.subject + ' (' + item.semester + ')</div>';
      html += '<div class="question-text">' + q.q + '</div>';
      html += '<div class="options-list">';
      q.options.forEach((opt, oi) => {
        html += '<button class="option-btn" data-oi="' + oi + '" onclick="pickReview(' + oi + ')">';
        html += '<span class="option-circle"></span>';
        html += '<span class="option-label">' + labels[oi] + '</span>';
        html += '<span>' + opt + '</span>';
        html += '</button>';
      });
      html += '</div></div>';
      document.getElementById('examContent').innerHTML = html;
    }

    window.pickReview = function(oi) {
      if (answered) return;
      answered = true;
      const item = qs[idx];
      const btns = document.querySelectorAll('.option-btn');
      btns.forEach((b, bi) => {
        b.classList.add('disabled');
        if (bi === item.answer) b.classList.add('correct');
        else if (bi === oi && oi !== item.answer) b.classList.add('wrong');
        if (bi === oi) b.classList.add('selected');
      });
      if (oi === item.answer) {
        score++;
        // Remove from wrong list if answered correctly
        try {
          let list = JSON.parse(localStorage.getItem('madrekjo_wrong_questions') || '[]');
          list = list.filter(x => !(x.subject === item.subject && x.qObj.q === item.qObj.q));
          localStorage.setItem('madrekjo_wrong_questions', JSON.stringify(list));
        } catch(e) {}
      }
      setTimeout(() => {
        idx++;
        if (idx < qs.length) showReviewQ();
        else showReviewResult();
      }, 900);
    };

    function showReviewResult() {
      const total = qs.length;
      document.getElementById('examContent').innerHTML =
        '<div class="result-card" style="display:block">' +
        '<div class="result-icon">🏆</div>' +
        '<div class="result-score">انتهت المراجعة</div>' +
        '<div class="result-label">لقد قمت بمراجعة الأسئلة الخاطئة بنجاح!</div>' +
        '<div class="result-detail">تم إزالة الأسئلة التي أجبت عليها بشكل صحيح من قائمة المراجعة.</div>' +
        '<button class="result-again" onclick="window.location.reload()">🔄 تحديث المراجعة</button>' +
        '</div>';
    }

    showReviewQ();
  }

} else if (!subject || !QUESTIONS[subject]) {
  document.getElementById('examSubject').textContent = '📖 ' + (subject || '');
  document.getElementById('examSemester').textContent = semester ? '— ' + semester : '';
  document.getElementById('examContent').innerHTML = '<div class="empty-state"><div class="icon">📝</div><h3>لا توجد أسئلة بعد</h3><p>سيتم إضافة أسئلة لهذه المادة قريباً</p></div>';
} else {
  document.getElementById('examSubject').textContent = '📖 ' + (subject || '');
  document.getElementById('examSemester').textContent = semester ? '— ' + semester : '';
  const qs = QUESTIONS[subject];
  let idx = 0, score = 0, answered = false;

  function showQ() {
    const q = qs[idx];
    const labels = ['أ', 'ب', 'ج', 'د'];
    const total = qs.length;
    const pct = ((idx + 1) / total) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = idx + 1 + ' / ' + total;
    answered = false;

    let html = '<div class="question-card" id="qCard">';
    html += '<div class="question-num">سؤال ' + (idx + 1) + '</div>';
    html += '<div class="question-text">' + q.q + '</div>';
    html += '<div class="options-list">';
    q.options.forEach((opt, oi) => {
      html += '<button class="option-btn" data-oi="' + oi + '" onclick="pick(' + oi + ')">';
      html += '<span class="option-circle"></span>';
      html += '<span class="option-label">' + labels[oi] + '</span>';
      html += '<span>' + opt + '</span>';
      html += '</button>';
    });
    html += '</div></div>';
    document.getElementById('examContent').innerHTML = html;
  }

  window.pick = function(oi) {
    if (answered) return;
    answered = true;
    const qItem = qs[idx];
    const btns = document.querySelectorAll('.option-btn');
    btns.forEach((b, bi) => {
      b.classList.add('disabled');
      if (bi === qItem.answer) b.classList.add('correct');
      else if (bi === oi && oi !== qItem.answer) b.classList.add('wrong');
      if (bi === oi) b.classList.add('selected');
    });

    if (oi === qItem.answer) {
      score++;
      // Also remove from wrong questions if answered correctly now
      try {
        let list = JSON.parse(localStorage.getItem('madrekjo_wrong_questions') || '[]');
        list = list.filter(x => !(x.subject === subject && x.qObj.q === qItem.q));
        localStorage.setItem('madrekjo_wrong_questions', JSON.stringify(list));
      } catch(e) {}
    } else {
      // Save to wrong questions
      try {
        let list = JSON.parse(localStorage.getItem('madrekjo_wrong_questions') || '[]');
        const exists = list.some(x => x.subject === subject && x.qObj.q === qItem.q);
        if (!exists) {
          list.push({ subject: subject, semester: semester || 'ف1', qObj: qItem, answer: qItem.answer });
          localStorage.setItem('madrekjo_wrong_questions', JSON.stringify(list));
        }
      } catch(e) {}
    }

    setTimeout(() => {
      idx++;
      if (idx < qs.length) showQ();
      else showResult();
    }, 800);
  };

  function showResult() {
    const total = qs.length;
    document.getElementById('examContent').innerHTML =
      '<div class="result-card" style="display:block">' +
      '<div class="result-icon">' + (score === total ? '🏆' : score >= total * 0.5 ? '🎉' : '💪') + '</div>' +
      '<div class="result-score">' + score + '/' + total + '</div>' +
      '<div class="result-label">' + (score === total ? 'ممتاز! إجابة كاملة' : score >= total * 0.5 ? 'أحسنت! استمر' : 'ركّز أكثر في المرة القادمة') + '</div>' +
      '<div class="result-detail">لقد أجبت على ' + score + ' من ' + total + ' أسئلة بشكل صحيح</div>' +
      '<button class="result-again" onclick="restart()">🔄 إعادة الاختبار</button>' +
      '</div>';
  }

  window.restart = function() {
    idx = 0; score = 0;
    showQ();
  };

  showQ();
}
</script>
</body>
</html>
