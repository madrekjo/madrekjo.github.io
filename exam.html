const p = new URLSearchParams(window.location.search);
const subject = p.get('subject');
const semester = p.get('semester');
const isReview = p.get('review') === 'true';
const SEM_DIRS = { 'ف1': 'semester-1', 'ف2': 'semester-2' };
const KEYS = ['A', 'B', 'C', 'D'];
const AR_LABELS = ['أ', 'ب', 'ج', 'د'];
const state = {
  slug: null, semDir: null, semIndex: null, semLabel: null,
  unit: null, origin: 'legacy', title: '', expected: 0, warningMsg: '',
  questions: [], idx: 0, score: 0, answered: false, answers: [], timer: null
};

if (isReview) {
  document.getElementById('examSubject').textContent = '🎯 المراجعه الختاميه — الأسئلة الخطأ';
  document.getElementById('examSemester').textContent = 'مراجعة الأسئلة السابقة التي أخطأت فيها';
  
  let wrongList = [];
  try { wrongList = JSON.parse(localStorage.getItem('madrekjo_wrong_questions') || '[]'); } catch(e) {}

  if (wrongList.length === 0) {
    document.getElementById('examContent').innerHTML = '<div class="empty-state"><div class="icon">✨</div><h3>لا توجد أسئلة خاطئة للمراجعة</h3><p>أنت ممتاز! لم تقم بالإجابة على أي سؤال بشكل خاطئ بعد، أو تم مسح السجل.</p></div>';
  } else {
    let idx = 0, score = 0, answered = false, timer = null;
    const qs = wrongList;
    const rAns = [];

    function showReviewQ() {
      const item = qs[idx];
      const q = item.qObj;
      const labels = ['أ', 'ب', 'ج', 'د'];
      const total = qs.length;
      const pct = ((idx + 1) / total) * 100;
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressText').textContent = (idx + 1) + ' / ' + total + ' (' + item.subject + ' - ' + item.semester + ')';
      const prev = rAns[idx];
      answered = !!prev;

      let html = '<div class="question-card" id="qCard">';
      html += '<div class="question-num">سؤال ' + (idx + 1) + ' من مادة: ' + item.subject + ' (' + item.semester + ')</div>';
      html += '<div class="question-text">' + q.q + '</div>';
      html += '<div class="options-list">';
      q.options.forEach((opt, oi) => {
        let cls = '';
        if (prev) {
          cls += ' disabled';
          if (oi === item.answer) cls += ' correct';
          if (oi === prev.chosen && oi !== item.answer) cls += ' wrong';
          if (oi === prev.chosen) cls += ' selected';
        }
        html += '<button class="option-btn' + cls + '" data-oi="' + oi + '" onclick="pickReview(' + oi + ')">';
        html += '<span class="option-circle"></span>';
        html += '<span class="option-label">' + labels[oi] + '</span>';
        html += '<span>' + opt + '</span>';
        html += '</button>';
      });
      html += '</div>';
      html += '<div class="qnav">';
      if (idx > 0) html += '<button class="qnav-btn" onclick="goPrevReview()">→ السابق</button>';
      if (prev && idx < total - 1) html += '<button class="qnav-btn" onclick="goNextReview()">التالي ←</button>';
      if (prev && idx === total - 1) html += '<button class="qnav-btn" onclick="showReviewResult()">🏁 عرض النتيجة</button>';
      html += '</div>';
      html += '</div>';
      document.getElementById('examContent').innerHTML = html;
      if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
    }

    window.pickReview = function(oi) {
      if (answered) return;
      answered = true;
      const item = qs[idx];
      const btns = document.querySelectorAll('.option-btn');
      btns.forEach((b, bi) => {
        b.classList.add('disabled');
        if (bi === item.answer) b.classList.add('correct');
        else if (bi === oi && oi !== item.answer) b.classList.add('wrong');
        if (bi === oi) b.classList.add('selected');
      });
      rAns[idx] = { chosen: oi, correct: oi === item.answer };
      if (oi === item.answer) {
        score++;
        // Remove from wrong list if answered correctly
        try {
          let list = JSON.parse(localStorage.getItem('madrekjo_wrong_questions') || '[]');
          list = list.filter(x => !(x.subject === item.subject && x.qObj.q === item.qObj.q));
          localStorage.setItem('madrekjo_wrong_questions', JSON.stringify(list));
        } catch(e) {}
      }
      clearTimeout(timer);
      timer = setTimeout(() => {
        idx++;
        if (idx < qs.length) showReviewQ();
        else showReviewResult();
      }, 900);
    };

    window.goPrevReview = function() {
      clearTimeout(timer);
      if (idx > 0) { idx--; showReviewQ(); }
    };

    window.goNextReview = function() {
      clearTimeout(timer);
      if (idx < qs.length - 1) { idx++; showReviewQ(); }
    };

    function showReviewResult() {
      const total = qs.length;
      document.getElementById('examContent').innerHTML =
        '<div class="result-card" style="display:block">' +
        '<div class="result-icon">🏆</div>' +
        '<div class="result-score">انتهت المراجعة</div>' +
        '<div class="result-label">لقد قمت بمراجعة الأسئلة الخاطئة بنجاح!</div>' +
        '<div class="result-detail">تم إزالة الأسئلة التي أجبت عليها بشكل صحيح من قائمة المراجعة.</div>' +
        '<button class="result-again" onclick="window.location.reload()">🔄 تحديث المراجعة</button>' +
        '</div>';
    }

    showReviewQ();
  }

} else {
  initData();
}

function showEmpty(title, msg) {
  document.getElementById('examContent').innerHTML =
    '<div class="empty-state"><div class="icon">📝</div><h3>' + title + '</h3><p>' + msg + '</p></div>';
}

function showError(title, msg) {
  document.getElementById('examContent').innerHTML =
    '<div class="error-box"><div class="icon">⚠️</div><h3>' + title + '</h3><p>' + msg + '</p>' +
    '<button class="back-btn" onclick="window.location.reload()">🔄 إعادة المحاولة</button></div>';
}

function normalizeQuestions(data) {
  if (Array.isArray(data)) return data;
  if (data && Array.isArray(data.questions)) return data.questions;
  if (data && data.lesson && Array.isArray(data.lesson.questions)) return data.lesson.questions;
  return [];
}

function validateQuestions(list) {
  const valid = [];
  const bad = [];
  list.forEach((q, i) => {
    const ok = q && q.id && q.question &&
      q.options && KEYS.every(k => typeof q.options[k] === 'string' && q.options[k].trim()) &&
      KEYS.includes(q.correct_answer) && q.correct_answer_text;
    if (ok) valid.push(q); else bad.push(i + 1);
  });
  return { valid: valid, bad: bad };
}

function toLegacyQ(q) {
  return { q: q.question, options: KEYS.map(k => q.options[k]), answer: KEYS.indexOf(q.correct_answer) };
}

function addToWrong(qItem) {
  try {
    let list = JSON.parse(localStorage.getItem('madrekjo_wrong_questions') || '[]');
    const qo = toLegacyQ(qItem);
    const exists = list.some(x => x.subject === subject && x.qObj.q === qo.q);
    if (!exists) {
      list.push({ subject: subject, semester: semester || 'ف1', qObj: qo, answer: qo.answer });
      localStorage.setItem('madrekjo_wrong_questions', JSON.stringify(list));
    }
  } catch(e) {}
}

function removeFromWrong(qItem) {
  try {
    let list = JSON.parse(localStorage.getItem('madrekjo_wrong_questions') || '[]');
    list = list.filter(x => !(x.subject === subject && x.qObj.q === qItem.question));
    localStorage.setItem('madrekjo_wrong_questions', JSON.stringify(list));
  } catch(e) {}
}

function startLegacy() {
  const qs = QUESTIONS[subject];
  if (!qs) {
    document.getElementById('examSubject').textContent = '📖 ' + (subject || '');
    document.getElementById('examSemester').textContent = semester ? '— ' + semester : '';
    showEmpty('لا توجد أسئلة بعد', 'سيتم إضافة أسئلة لهذه المادة قريباً');
    return;
  }
  document.getElementById('examSubject').textContent = '📖 ' + subject;
  document.getElementById('examSemester').textContent = semester ? '— ' + semester : '';
  state.origin = 'legacy';
  state.title = subject;
  state.expected = qs.length;
  state.warningMsg = '';
  state.questions = qs.map((q, i) => ({
    id: 'legacy-' + (i + 1),
    number: i + 1,
    question: q.q,
    options: { A: q.options[0], B: q.options[1], C: q.options[2], D: q.options[3] },
    correct_answer: KEYS[q.answer],
    correct_answer_text: q.options[q.answer]
  }));
  state.idx = 0; state.score = 0; state.answers = [];
  showQ();
}

function initData() {
    fetch('questions/index.json', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error('index'); return r.json(); })
    .then(idxData => {
      const rec = (idxData.subjects || []).find(s => s.name === subject);
      const semDir = SEM_DIRS[semester];
      if (!rec || !rec.slug || !semDir) { startLegacy(); return; }
      state.slug = rec.slug;
      state.semDir = semDir;
      fetch('questions/' + rec.slug + '/' + semDir + '/index.json', { cache: 'no-store' })
        .then(r => { if (!r.ok) throw new Error('sem'); return r.json(); })
        .then(idx => {
          state.semIndex = idx;
          state.semLabel = idx.semester_label || semester;
          document.getElementById('examSubject').textContent = '📖 ' + subject;
          document.getElementById('examSemester').textContent = '— ' + state.semLabel;
          renderUnits();
        })
        .catch(() => showError('لا توجد أسئلة لهذا الفصل بعد', 'لم يتم العثور على أسئلة للفصل الدراسي المحدد. جرّب فصلاً آخر أو عُد لاحقاً.'));
    })
    .catch(() => startLegacy());
}

function renderUnits() {
  const units = state.semIndex.units || [];
  if (!units.length) { showEmpty('لا توجد وحدات بعد', 'سيتم إضافة وحدات لهذه المادة قريباً'); return; }
  let html = '<div class="units-grid">';
  units.forEach((u, ui) => {
    const lessonCount = (u.lessons || []).length;
    const hasRev = !!u.review;
    html += '<button class="unit-card" onclick="openUnit(' + ui + ')">' +
      '<div class="unit-num">الوحدة ' + (u.number || ui + 1) + '</div>' +
      '<div class="unit-name">' + u.name + '</div>' +
      '<div class="unit-meta">' + lessonCount + (lessonCount === 1 ? ' درس' : ' دروس') + (hasRev ? ' · مراجعة' : '') + '</div>' +
      '</button>';
  });
  html += '</div>';
  document.getElementById('examContent').innerHTML = html;
}

function openUnit(ui) {
  state.unit = state.semIndex.units[ui];
  renderLessons();
}

function renderLessons() {
  const u = state.unit;
  let html = '<button class="back-btn" onclick="renderUnits()">→ رجوع للوحدات</button>';
  html += '<div class="section-title">' + u.name + '</div>';
  html += '<div class="lesson-list">';
  (u.lessons || []).forEach((l, li) => {
    html += '<button class="lesson-card" onclick="startLesson(' + li + ')">' +
      '<div class="lesson-num">درس ' + (l.number || li + 1) + '</div>' +
      '<div class="lesson-name">' + l.name + '</div>' +
      '<div class="lesson-go">ابدأ الاختبار ▶</div>' +
      '</button>';
  });
  if (u.review) {
    html += '<button class="lesson-card review-card" onclick="startReview()">' +
      '<div class="lesson-num">مراجعة</div>' +
      '<div class="lesson-name">' + u.review.name + '</div>' +
      '<div class="lesson-go">ابدأ الاختبار ▶</div>' +
      '</button>';
  }
  html += '</div>';
  document.getElementById('examContent').innerHTML = html;
}

function startLesson(li) {
  const l = state.unit.lessons[li];
  state.title = 'درس ' + (l.number || li + 1) + ' — ' + l.name;
  loadQuiz('questions/' + state.slug + '/' + state.semDir + '/' + l.file, state.title, 40);
}

function startReview() {
  const r = state.unit.review;
  state.title = r.name;
  loadQuiz('questions/' + state.slug + '/' + state.semDir + '/' + r.file, state.title, 50);
}

function loadQuiz(path, title, expected) {
  fetch(path, { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('load'); return r.json(); })
    .then(data => {
      const { valid, bad } = validateQuestions(normalizeQuestions(data));
      if (!valid.length) { showError('لا توجد أسئلة صالحة', 'تعذّر قراءة الأسئلة من الملف. تأكد من صحة البيانات.'); return; }
      state.origin = 'data';
      state.title = title;
      state.expected = expected;
      state.questions = valid;
      state.idx = 0; state.score = 0; state.answers = [];
      const warns = [];
      if (valid.length !== expected) warns.push('تم تحميل ' + valid.length + ' من ' + expected + ' سؤالاً متوقعاً');
      if (bad.length) warns.push('تم تجاهل ' + bad.length + ' سؤالاً ناقصاً');
      state.warningMsg = warns.length ? warns.join(' · ') : '';
      document.getElementById('examSubject').textContent = '📖 ' + subject;
      document.getElementById('examSemester').textContent = '— ' + state.semLabel + ' · ' + title;
      showQ();
    })
    .catch(() => showError('تعذّر تحميل الأسئلة', 'لم يتم العثور على ملف الأسئلة أو أنه غير قابل للقراءة.'));
}

  document.getElementById('examContent').innerHTML = html;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
}

window.pick = function(key) {
  const qItem = state.questions[state.idx];
  state.answered = true;
  state.answers[state.idx] = { q: qItem, chosen: key, correct: key === qItem.correct_answer };
  document.querySelectorAll('.option-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.key === key);
    // Do NOT add 'correct' or 'wrong' classes during test - these are hidden
    // b.classList.add('correct') would only apply after finishing
    // b.classList.add('wrong') would only apply after finishing
  });
  // Do NOT show review section during test - kept hidden until finish
  // const qCard = document.getElementById('qCard');
  // if (qCard) {
  //   const reviewSection = qCard.querySelector('.review-section');
  //   if (reviewSection) {
  //     reviewSection.style.display = 'block';
  //   }
  // }
  // Remove timeout that auto-advanced
  clearTimeout(state.timer);
};

window.goPrev = function() {
  clearTimeout(state.timer);
  if (state.idx > 0) {
    state.idx--;
    state.answered = false;
    showQ();
  }
};

window.goNext = function() {
  clearTimeout(state.timer);
  if (state.idx < state.questions.length - 1) {
    state.idx++;
    showQ();
  } else {
    showResult();
  }
};

function showResult() {
  const total = state.questions.length;
  state.score = 0;
  state.questions.forEach((q, i) => {
    const a = state.answers[i];
    const correct = a && a.correct;
    if (correct) { state.score++; removeFromWrong(q); }
    else { addToWrong(q); }
  });
  const pct = total ? Math.round((state.score / total) * 100) : 0;
  const icon = state.score === total ? '🏆' : state.score >= total * 0.5 ? '🎉' : '💪';
  const label = state.score === total ? 'ممتاز! إجابة كاملة' : state.score >= total * 0.5 ? 'أحسنت! استمر' : 'ركّز أكثر في المرة القادمة';
  
  // Build detailed result with each question's info
  let html = '<div class="result-card" style="display:block">' +
    '<div class="result-icon">' + icon + '</div>' +
    '<div class="result-score">' + state.score + '/' + total + '</div>' +
    '<div class="result-label">' + label + '</div>';
    
  // Add detailed per-question results
  html += '<div class="result-questions-detail" style="margin: 20px 0; max-height: 400px; overflow-y: auto;">';
  state.questions.forEach((q, i) => {
    const a = state.answers[i];
    const isCorrect = a && a.correct;
    html += '<div style="background: var(--surface2); border-radius: 12px; padding: 12px; margin: 8px 0; border-left: 4solid ' + (isCorrect ? '#4caf50' : '#f44336') + ';">';
    html += '<div style="font-family: \'Tajawal\', sans-serif; font-size: 1rem; font-weight: 600; color: var(--a); margin-bottom: 6px;">سؤال ' + (i + 1) + ' من ' + total + '</div>';
    html += '<div style="font-family: \'Tajawal\', sans-serif; font-size: 0.85rem; color: var(--text); margin: 4px 0;">' + q.question + '</div>';
    html += '<div style="display: flex; justify-content: space-between; margin: 8px 0;">';
    html += '<div style="flex: 1; color: var(--muted); font-size: 0.78rem;">إجابتك: ' + (a ? (a.chosen ? AR_LABELS[KEYS.indexOf(a.chosen)] : 'لم تجب') : 'لا توجد إجابة') + '</div>';
    html += '<div style="color: var(--a); font-size: 0.78rem;">الصحيحة: ' + q.correct_answer + '</div>';
    html += '</div>';
    if (q.solution && (q.solution.formula || q.solution.steps || q.solution.summary)) {
      html += '<div style="margin: 8px 0; font-size: 0.8rem; color: var(--muted);"><strong>خطوات الحل:</strong> ';
      if (q.solution.formula) html += q.solution.formula + ' · ';
      if (q.solution.steps && q.solution.steps.length) {
        html += q.solution.steps.map(s => s || '').join(' | ');
      }
      if (q.solution.summary) html += ' · ' + q.solution.summary;
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  
  html += '<div class="result-actions" style="margin-top: 20px">';
  html += '<button class="result-again" onclick="restart()">🔄 إعادة الاختبار</button>';
  html += '<button class="result-again secondary" onclick="showAnswers()">📋 الإجابات النموذجية</button>';
  html += '</div>';
  if (state.origin === 'data') html += '<button class="back-btn center" onclick="renderLessons()">→ رجوع للدروس</button>';
  if (state.origin === 'legacy') html += '<button class="back-btn center" onclick="window.location=\'index.html\'">→ العودة للقائمة</button>';
  html += '</div>';
  html += '<p class="result-message" style="margin: 20px 0; font-size: 0.9rem; color: var(--muted);">يمكنك مراجعة الإجابات الخاطئة والأسئلة وتفسير الحلول من الأقسام أعلاه، أو إعادة الاختبار لتحسين درجاتك.</p>';
  document.getElementById('examContent').innerHTML = html;
}

window.restart = function() {
  state.idx = 0; state.score = 0; state.answers = [];
  showQ();
};

window.showAnswers = function() {
  let html = '<button class="back-btn" onclick="showResult()">→ رجوع للنتيجة</button>';
  html += '<div class="answers-title">الإجابات النموذجية — ' + state.title + '</div>';
  state.questions.forEach((q, i) => {
    const a = state.answers[i];
    if (!a) return;
    html += '<div class="answer-card' + (a.correct ? ' ok' : ' no') + '">';
    html += '<div class="answer-q">' + (i + 1) + '. ' + q.question + '</div>';
    html += '<div class="answer-line">' + (a.correct ? '✅ إجابتك صحيحة' : '❌ إجابتك خطأ') + '</div>';
    if (!a.correct && a.chosen) {
      const ci = KEYS.indexOf(a.chosen);
      html += '<div class="answer-chosen">إجابتك: ' + AR_LABELS[ci] + ' — ' + q.options[a.chosen] + '</div>';
    }
    html += '<div class="answer-correct">الإجابة الصحيحة: ' + q.correct_answer + ' — ' + (q.correct_answer_text || q.options[q.correct_answer]) + '</div>';
    const src = q.source;
    if (src) {
      let s = '📄';
      if (src.page) s += ' صفحة ' + src.page;
      if (src.reference) s += (src.page ? ' · ' : ' ') + src.reference;
      if (src.lesson) s += ' · ' + src.lesson;
      html += '<div class="answer-source">' + s + '</div>';
    }
    if ((q.solution && (q.solution.formula || q.solution.steps || q.solution.summary)) || q.explanation) {
      html += '<button class="sol-toggle" onclick="this.classList.toggle(\'open\');this.nextElementSibling.classList.toggle(\'show\')">🔍 شرح الحل</button>';
      html += '<div class="solution-box">';
      if (q.solution) {
        if (q.solution.formula) html += '<div class="sol-formula">' + q.solution.formula + '</div>';
        if (q.solution.steps && q.solution.steps.length) {
          html += '<ol class="sol-steps">';
          q.solution.steps.forEach(s => { if (s) html += '<li>' + s + '</li>'; });
          html += '</ol>';
        }
        if (q.solution.summary) html += '<div class="sol-summary">' + q.solution.summary + '</div>';
      }
      if (q.explanation) html += '<div class="sol-explain">💡 ' + q.explanation + '</div>';
      html += '</div>';
    }
    html += '</div>';
  });
  document.getElementById('examContent').innerHTML = html;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
};
</script>
</body>
</html>
