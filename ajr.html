<style>
:root {
  --deep: #0a0a0f;
  --surface: #111118;
  --surface2: #1a1a24;
  --surface3: #232330;
  --gold: #FFD700;
  --gold-light: #FFF3B0;
  --gold-dim: rgba(255,215,0,0.1);
  --gold-border: rgba(255,215,0,0.22);
  --text: #f0f0f5;
  --muted: #888899;
  --ok: #69f0ae;
  --err: #ff6b6b;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family:'Cairo',sans-serif;
  background: var(--deep);
  color: var(--text);
  min-height:100vh;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,215,0,0.02) 2px, rgba(255,215,0,0.02) 3px),
    radial-gradient(ellipse at 50% 20%, rgba(255,215,0,0.05) 0%, transparent 55%);
}
.wrap { max-width:760px; margin:0 auto; padding:20px 16px 40px; }

.app-header { text-align:center; margin-bottom:4px; }
.app-title {
  font-weight:900; font-size:1.7rem;
  background: linear-gradient(135deg, var(--gold), var(--gold-light), #B8860B);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}
.app-sub { color:var(--muted); font-size:0.85rem; margin-top:4px; }

.date-line {
  display:flex; align-items:center; justify-content:center; gap:8px;
  color:var(--muted); font-size:0.9rem; margin:14px 0;
  flex-wrap:wrap;
}
.date-line b { color:var(--gold); font-weight:700; }

.sec { background:var(--surface); border:1px solid var(--gold-border); border-radius:20px; padding:20px 18px; margin-bottom:18px; box-shadow:0 6px 24px rgba(0,0,0,.35); }
.sec-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.sec-title { display:flex; align-items:center; gap:10px; color:var(--gold); font-weight:900; font-size:1.15rem; }
.sec-icon { background:var(--gold-dim); border:1px solid var(--gold-border); border-radius:50%; width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:1.05rem; }

.icon-btn {
  background:var(--surface2); color:var(--text); border:1px solid var(--gold-border);
  border-radius:12px; padding:8px 12px; font-family:'Cairo',sans-serif; font-size:0.85rem;
  cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:6px;
}
.icon-btn:hover { border-color:var(--gold); color:var(--gold); }

.page-badge {
  background:var(--surface2); border:1px solid var(--gold-border); border-radius:12px;
  padding:8px 14px; text-align:center; font-size:0.86rem; color:var(--muted); margin-bottom:12px;
}
.page-badge span { color:var(--text); }
.return-today { color:var(--gold); text-decoration:underline; cursor:pointer; margin-right:8px; font-size:0.82rem; }

.player-bar {
  display:flex; flex-direction:column; gap:10px; background:var(--surface2);
  border:1px solid var(--gold-border); border-radius:14px; padding:12px;
  margin-bottom:10px;
}
@media(min-width:520px){ .player-bar { flex-direction:row; align-items:center; } }
.reciter-select {
  flex:1; background:var(--deep); color:var(--text); border:1px solid var(--gold-border);
  border-radius:12px; padding:10px 12px; font-family:'Cairo',sans-serif; font-size:0.92rem;
  cursor:pointer; min-width:0;
}
.player-btns { display:flex; gap:8px; }
.play-btn {
  flex:1; background:linear-gradient(135deg, var(--gold), #E6C200); color:#1a1200;
  border:none; border-radius:12px; padding:10px 18px; font-family:'Cairo',sans-serif;
  font-weight:800; font-size:0.95rem; cursor:pointer; transition:filter .2s;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.play-btn:hover { filter:brightness(1.08); }
.play-btn:disabled { opacity:.4; cursor:not-allowed; }
.nav-btn {
  background:var(--deep); color:var(--text); border:1px solid var(--gold-border);
  border-radius:12px; padding:10px 14px; cursor:pointer; font-size:1rem; transition:all .2s;
}
.nav-btn:hover:not(:disabled) { border-color:var(--gold); color:var(--gold); }
.nav-btn:disabled { opacity:.35; cursor:not-allowed; }
.now-playing { text-align:center; font-size:0.82rem; color:var(--muted); margin-bottom:8px; min-height:20px; }
.now-playing span { color:var(--gold); }

.ayah-box {
  background:var(--deep); border:1px solid var(--gold-border); border-radius:14px;
  padding:20px 16px; min-height:120px; display:flex; align-items:center; justify-content:center;
}
.ayah-text {
  font-family:'Amiri', serif; font-size:1.45rem; line-height:2.3; text-align:right;
  direction:rtl; white-space:normal; overflow-wrap:break-word; word-break:break-word;
}
.ayah-text .ayah { transition:background .2s; border-radius:6px; padding:0 2px; }
.ayah-text .ayah.playing { background:var(--gold-dim); border:1px solid var(--gold-border); }
.ayah-number { color:var(--gold); }
.loading { color:var(--muted); font-size:0.95rem; }
.error { color:var(--err); font-size:0.95rem; text-align:center; }

.bismallah {
  font-family:'Amiri',serif; text-align:center; color:var(--gold); font-size:1.3rem;
  margin-bottom:14px; opacity:.9;
}

.hadith-counter {
  background:var(--gold-dim); border:1px solid var(--gold-border); color:var(--gold);
  border-radius:12px; padding:6px 12px; font-size:0.82rem; font-weight:700; margin-bottom:6px;
  display:inline-block;
}
.hadith-quote { font-family:'Amiri',serif; font-size:1.35rem; line-height:2.1; margin:14px 0; }
.hadith-meta { color:var(--muted); font-size:0.88rem; margin-top:6px; }
.hadith-meta b { color:var(--text); font-weight:600; }
.explain-btn {
  margin-top:12px; background:var(--surface2); border:1px solid var(--gold-border); color:var(--gold);
  border-radius:12px; padding:8px 14px; font-family:'Cairo',sans-serif; font-size:0.85rem; font-weight:700;
  cursor:pointer; width:100%; transition:all .2s; text-align:right;
}
.explain-btn:hover { border-color:var(--gold); }
.explain-body {
  display:none; background:var(--deep); border:1px solid var(--gold-border); border-radius:12px;
  padding:14px; margin-top:10px; font-size:0.95rem; line-height:1.9; color:var(--text);
}
.explain-open .explain-body { display:block; }

.page-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:50; align-items:flex-end; justify-content:center; }
.page-modal.open { display:flex; }
.page-panel {
  width:100%; max-width:720px; max-height:78vh; background:var(--surface); border:1px solid var(--gold-border);
  border-radius:20px 20px 0 0; overflow:hidden; display:flex; flex-direction:column;
}
.page-panel-head { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--gold-border); }
.page-panel-head h3 { color:var(--gold); font-size:1rem; }
.page-list { overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
.page-item {
  text-align:right; background:var(--surface2); border:1px solid var(--gold-border); border-radius:12px;
  padding:12px 14px; cursor:pointer; transition:all .2s; font-family:'Cairo',sans-serif;
}
.page-item:hover { border-color:var(--gold); background:var(--surface3); }
.page-item.active { border-color:var(--gold); background:var(--gold-dim); }
.page-item .pi-day { font-weight:800; color:var(--text); font-size:0.95rem; }
.page-item .pi-day span { color:var(--gold); }
.page-item .pi-sub { color:var(--muted); font-size:0.82rem; margin-top:2px; }

.footer { text-align:center; padding:16px 0 4px; color:var(--muted); font-size:0.8rem; }
.footer b { color:var(--gold); }
</style>

const hadiths = [{"id": 1, "text": "إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى", "narrator": "عمر بن الخطاب رضي الله عنه", "source": "صحيح البخاري", "explanation": "هذا الحديث أصلٌ عظيم في الإسلام، يبيّن أن قبول الأعمال وأجرها يتوقف على نية صاحبها، فمن أخلص لله نال الأجر، ومن قصد الدنيا لم يكن له إلا ما نوى. لذلك قال العلماء: هذا الحديث ثلث الإسلام."}, {"id": 2, "text": "لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه", "narrator": "أنس بن مالك رضي الله عنه", "source": "صحيح البخاري", "explanation": "كمال الإيمان يقتضي محبة الخير للآخرين كما يحبه المرء لنفسه، وهذا يشمل المسلم وكل من يستحق المحبة. والحديث يدعو لتطهير القلب من الحسد والأنانية، وبناء مجتمع متحاب متعاون."}, {"id": 3, "text": "من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت", "narrator": "أبو هريرة رضي الله عنه", "source": "صحيح البخاري", "explanation": "حفظ اللسان من علامات الإيمان، فالمؤمن إما أن ينطق بالخير من ذكر ونصيحة وكلمة طيبة، وإما أن يصمت. والحديث يحذّر من الكلام الذي لا فائدة فيه أو فيه أذية للآخرين."}, {"id": 4, "text": "المسلم من سلم المسلمون من لسانه ويده", "narrator": "عبد الله بن عمرو رضي الله عنهما", "source": "صحيح البخاري", "explanation": "حقيقة الإسلام تظهر في معاملة الإنسان للآخرين، فالمسلم الكامل من لا يؤذي غيره بقوله (لسانه) ولا بفعله (يده). وهذا يشمل ترك الغيبة والسبّ والاعتداء بكل صوره."}, {"id": 5, "text": "لا تغضب، لا تغضب، لا تغضب", "narrator": "أبو هريرة رضي الله عنه", "source": "صحيح البخاري", "explanation": "كرّر النبي ﷺ الوصية ثلاث مرات لأهميتها، فالغضب مفتاح الشرور وسبب لكثير من الذنوب كالقتل والطلاق والقطيعة. والمطلوب: ضبط النفس عند الغضب وعدم تنفيذ ما يمليه من تصرفات."}, {"id": 6, "text": "الدين النصيحة", "narrator": "تميم الداري رضي الله عنه", "source": "صحيح مسلم", "explanation": "النصيحة هي إرادة الخير للمنصوح. والحديث يبيّن أن الدين كله مبني على النصيحة لله (بطاعته)، ولكتابه (بتدبره)، ولرسوله (باتباعه)، ولأئمة المسلمين (بطاعتهم في المعروف)، وعامتهم (بإرشادهم)."}, {"id": 7, "text": "من حسن إسلام المرء تركه ما لا يعنيه", "narrator": "أبو هريرة رضي الله عنه", "source": "سنن الترمذي", "explanation": "من علامات قوة الإيمان أن يترك المرء كل ما لا يفيده في دينه أو دنياه، فلا يتدخل فيما لا يخصه ولا يشغل وقته بما لا ينفعه. وهذا الحديث قاعدة عظيمة لتنظيم الحياة وحفظ الوقت."}, {"id": 8, "text": "لا يؤمن أحدكم حتى أكون أحب إليه من والده وولده والناس أجمعين", "narrator": "أنس بن مالك رضي الله عنه", "source": "صحيح البخاري", "explanation": "محبة النبي ﷺ ركن من أركان الإيمان، ويجب أن تكون مقدّمة على محبة كل مخلوق. وعلامة هذه المحبة: اتباع سنته وتقديم أمره على هوى النفس ورغبات الناس."}, {"id": 9, "text": "اتق الله حيثما كنت، وأتبع السيئة الحسنة تمحها، وخالق الناس بخلق حسن", "narrator": "معاذ بن جبل رضي الله عنه", "source": "سنن الترمذي", "explanation": "وصية جامعة تحوي ثلاثة أصول: تقوى الله في السر والعلن، ومحو الذنوب بالحسنات والتوبة، ومعاملة الناس بأخلاق حسنة. من جمع هذه الثلاث فقد جمع خير الدنيا والآخرة."}, {"id": 10, "text": "ازهد في الدنيا يحبك الله، وازهد فيما عند الناس يحبك الناس", "narrator": "سهل بن سعد رضي الله عنه", "source": "سنن ابن ماجه", "explanation": "الزهد في الدنيا لا يعني تركها بالكلية، بل عدم تعلق القلب بها. ومن لم يطمع فيما عند الناس استراح وأحبّوه. والحديث يرسم طريق محبة الله ومحبة الناس معاً."}, {"id": 11, "text": "من سلك طريقاً يلتمس فيه علماً سهل الله له به طريقاً إلى الجنة", "narrator": "أبو هريرة رضي الله عنه", "source": "صحيح مسلم", "explanation": "طلب العلم الشرعي من أعظم القربات، ومن جزاء طالب العلم أن الله ييسّر له طريق الجنة. والطريق هنا يشمل المسير الحسي للمجالس العلمية، والمعنوي بالقراءة والمذاكرة."}, {"id": 12, "text": "المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف", "narrator": "أبو هريرة رضي الله عنه", "source": "صحيح مسلم", "explanation": "القوة المقصودة هي قوة الإيمان والعزيمة، وكذلك القوة البدنية والعلمية والمالية إذا استُعملت في طاعة الله. فالمسلم مطالَب بالسعي في كل ما يُقوّي دينه ودنياه."}, {"id": 13, "text": "إن الله طيب لا يقبل إلا طيباً", "narrator": "أبو هريرة رضي الله عنه", "source": "صحيح مسلم", "explanation": "الله سبحانه منزّه عن كل نقص، ولا يقبل من الأعمال إلا ما كان خالصاً صحيحاً، ولا من الأموال إلا ما كان حلالاً. لذلك يجب على المسلم أن يحرص على طيب المطعم والمكسب."}, {"id": 14, "text": "دع ما يريبك إلى ما لا يريبك", "narrator": "الحسن بن علي رضي الله عنهما", "source": "سنن الترمذي", "explanation": "إذا اشتبه عليك أمر هل هو حلال أو حرام، فاتركه إلى ما لا شك فيه. وهذه قاعدة الورع التي تحفظ المسلم من الوقوع في الحرام بسبب التساهل في المشتبهات."}, {"id": 15, "text": "لا ضرر ولا ضرار", "narrator": "أبو سعيد الخدري رضي الله عنه", "source": "سنن ابن ماجه", "explanation": "قاعدة فقهية كبرى: لا يجوز للمسلم أن يضرّ نفسه ابتداءً، ولا أن يضرّ غيره. وعلى هذه القاعدة بُنيت كثير من أحكام الشريعة في المعاملات والجوار والبيئة."}, {"id": 16, "text": "من رأى منكم منكراً فليغيره بيده، فإن لم يستطع فبلسانه، فإن لم يستطع فبقلبه وذلك أضعف الإيمان", "narrator": "أبو سعيد الخدري رضي الله عنه", "source": "صحيح مسلم", "explanation": "إنكار المنكر واجب على كل مسلم بحسب قدرته: باليد لمن يملك السلطة، باللسان للناصح والمعلم، وبالقلب لمن لا يقدر على غيرهما. وإنكار القلب هو الحد الأدنى الذي لا يُعذر أحد بتركه."}, {"id": 17, "text": "ما نهيتكم عنه فاجتنبوه، وما أمرتكم به فافعلوا منه ما استطعتم", "narrator": "أبو هريرة رضي الله عنه", "source": "صحيح البخاري", "explanation": "النواهي يجب اجتنابها كلها مهما كانت، أما الأوامر فيُؤتى منها قدر المستطاع. والحديث يبيّن يُسر الإسلام ورفع الحرج عن الأمة."}, {"id": 18, "text": "إن الحلال بيّن وإن الحرام بيّن وبينهما أمور مشتبهات", "narrator": "النعمان بن بشير رضي الله عنهما", "source": "صحيح البخاري", "explanation": "الأحكام ثلاثة أقسام: حلال واضح، وحرام واضح، ومشتبهات بينهما. ومن اتقى المشتبهات فقد استبرأ لدينه وعرضه، ومن وقع فيها أوشك أن يقع في الحرام."}, {"id": 19, "text": "البر حسن الخلق، والإثم ما حاك في نفسك وكرهت أن يطلع عليه الناس", "narrator": "النواس بن سمعان رضي الله عنه", "source": "صحيح مسلم", "explanation": "البر معناه الواسع: حسن الخلق مع الناس. والإثم ميزانه: ما تردد في صدرك وخفت أن يراه الناس. فالقلب السليم له فطرة تميّز بين الخير والشر."}, {"id": 20, "text": "قل آمنت بالله ثم استقم", "narrator": "سفيان بن عبد الله رضي الله عنه", "source": "صحيح مسلم", "explanation": "كلمة جامعة في الإسلام: الإيمان بالله، ثم الاستقامة على شرعه. والاستقامة تعني السير على الصراط المستقيم في كل العبادات والمعاملات والأخلاق."}, {"id": 21, "text": "تبسمك في وجه أخيك صدقة", "narrator": "أبو ذر الغفاري رضي الله عنه", "source": "سنن الترمذي", "explanation": "الإسلام دين سهل ميسّر، حتى البسمة الصادقة في وجه الأخ المسلم تُحتسب صدقة عند الله. وفي الحديث ترغيب في إدخال السرور على القلوب وتطييب الخواطر."}, {"id": 22, "text": "الطهور شطر الإيمان", "narrator": "أبو مالك الأشعري رضي الله عنه", "source": "صحيح مسلم", "explanation": "الطهارة من الحدث والنجس نصف الإيمان من حيث الأهمية، لأنها شرط لصحة الصلاة التي هي عمود الدين. وتشمل الطهارة الحسية والمعنوية بتزكية القلب من الذنوب."}, {"id": 23, "text": "من قام ليلة القدر إيماناً واحتساباً غفر له ما تقدم من ذنبه", "narrator": "أبو هريرة رضي الله عنه", "source": "صحيح البخاري", "explanation": "ليلة القدر خير من ألف شهر، ومن أحياها بالصلاة والدعاء مؤمناً بفضلها راجياً ثوابها، غفر الله له ذنوبه السابقة. لذلك يُستحب الاجتهاد في العشر الأواخر من رمضان."}, {"id": 24, "text": "خيركم من تعلم القرآن وعلمه", "narrator": "عثمان بن عفان رضي الله عنه", "source": "صحيح البخاري", "explanation": "أعظم الناس منزلة من جمع بين تعلّم القرآن وتعليمه، لأنه يُكمّل غيره بعد أن يكمّل نفسه. والحديث ترغيب عظيم في خدمة كتاب الله تلاوة وحفظاً وتفسيراً."}, {"id": 25, "text": "الدعاء هو العبادة", "narrator": "النعمان بن بشير رضي الله عنه", "source": "سنن الترمذي", "explanation": "الدعاء من أعظم العبادات وأفضلها، لأنه يجمع بين التوحيد والافتقار إلى الله. ومن ترك الدعاء فقد تكبّر، ومن داوم عليه قرّبه الله إليه."}, {"id": 26, "text": "إن الله يحب إذا عمل أحدكم عملاً أن يتقنه", "narrator": "عائشة رضي الله عنها", "source": "المعجم الأوسط", "explanation": "الإسلام دين الإتقان، يحب الله من العبد إتقان عمله مهما كان نوعه: عبادة أو وظيفة أو حرفة. والإتقان يعني أداء العمل بأكمل وجه وأحسن صورة."}, {"id": 27, "text": "ما ملأ ابن آدم وعاء شراً من بطنه", "narrator": "المقدام بن معدي كرب رضي الله عنه", "source": "سنن الترمذي", "explanation": "الإسراف في الأكل من أكبر أسباب الأمراض وقسوة القلب وكسل العبادة. والسنة: ثلث للطعام وثلث للشراب وثلث للنفس. وفي الحديث دعوة للاعتدال والصحة البدنية."}, {"id": 28, "text": "الكلمة الطيبة صدقة", "narrator": "أبو هريرة رضي الله عنه", "source": "صحيح البخاري", "explanation": "الكلمة الطيبة من ذكر أو نصيحة أو ثناء أو تطييب خاطر، تُكتب صدقة عند الله. وهذا يبيّن سعة فضل الله، حيث جعل الأقوال الحسنة من جنس الصدقات."}, {"id": 29, "text": "أحب الأعمال إلى الله أدومها وإن قل", "narrator": "عائشة رضي الله عنها", "source": "صحيح البخاري", "explanation": "الاستمرار على العمل الصالح وإن كان قليلاً أحب إلى الله من العمل الكثير المنقطع. لذلك يُستحب اختيار الأذكار والنوافل التي يُمكن المداومة عليها دون انقطاع."}, {"id": 30, "text": "إنما بعثت لأتمم مكارم الأخلاق", "narrator": "أبو هريرة رضي الله عنه", "source": "مسند أحمد", "explanation": "من مقاصد بعثة النبي ﷺ إكمال وتتميم الأخلاق الفاضلة. فالإسلام دين الأخلاق قبل أن يكون دين عبادات منفصلة، والأخلاق ميزان قبول الأعمال عند الله."}];
const reciters = [{"id": "afasy", "name": "مشاري راشد العفاسي", "source": "everyayah", "path": "Alafasy_128kbps"}, {"id": "sudais", "name": "عبدالرحمن السديس", "source": "everyayah", "path": "Abdurrahmaan_As-Sudais_192kbps"}, {"id": "husary", "name": "محمود خليل الحصري (مرتل)", "source": "everyayah", "path": "Husary_128kbps"}, {"id": "minshawi", "name": "محمد صديق المنشاوي (مرتل)", "source": "everyayah", "path": "Minshawy_Murattal_128kbps"}, {"id": "ghamdi", "name": "سعد الغامدي", "source": "everyayah", "path": "Ghamadi_40kbps"}, {"id": "shuraim", "name": "سعود الشريم", "source": "everyayah", "path": "Saood_ash-Shuraym_128kbps"}, {"id": "muaiqly", "name": "ماهر المعيقلي", "source": "everyayah", "path": "MaherAlMuaiqly128kbps"}, {"id": "dossari", "name": "ياسر الدوسري", "source": "everyayah", "path": "Yasser_Ad-Dussary_128kbps"}, {"id": "jaber", "name": "علي جابر", "source": "everyayah", "path": "Ali_Jaber_64kbps"}];
const RECITER_KEY = 'preferred_reciter';

const START = new Date(2026, 3, 6);
const now = new Date();
now.setHours(0,0,0,0);
const start = new Date(START); start.setHours(0,0,0,0);
const dayIndex = Math.max(0, Math.floor((now.getTime() - start.getTime()) / (1000*60*60*24)));
const todayStr = new Date().toLocaleDateString('ar-SA', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
document.getElementById('dateLine').innerHTML = '📅 ' + todayStr + ' — اليوم رقم <b>' + (dayIndex+1) + '</b>';

const NUM = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
const toAr = n => String(n).split('').map(d => NUM[parseInt(d,10)] ?? d).join('');

const currentPageIndex = dayIndex % quranPages.length;
let viewedPageIndex = currentPageIndex;
let ayat = [];
let loading = true;
let error = null;
let reciterId = localStorage.getItem(RECITER_KEY) || 'afasy';
if (!reciters.some(r => r.id === reciterId)) reciterId = 'afasy';
let isPlaying = false;
let currentAyahIdx = 0;

const monthDayYearShort = new Date().toLocaleDateString('ar-SA'); // padding not needed

const el = id => document.getElementById(id);
const reciterSelect = el('reciterSelect');
const playBtn = el('playBtn');
const prevBtn = el('prevBtn');
const nextBtn = el('nextBtn');
const nowPlaying = el('nowPlaying');
const ayahContent = el('ayahContent');
const pageBadge = el('pageBadge');
const pageList = el('pageList');
const pageModal = el('pageModal');

reciters.forEach(r => {
  const o = document.createElement('option');
  o.value = r.id; o.textContent = r.name;
  reciterSelect.appendChild(o);
});
reciterSelect.value = reciterId;

const reciter = () => reciters.find(r => r.id === reciterId) || reciters[0];
const page = () => quranPages[viewedPageIndex];
const getAyahSrc = n => {
  const p = page(); const r = reciter();
  const s = String(p.surahNumber).padStart(3,'0');
  const a = String(n).padStart(3,'0');
  return 'https://everyayah.com/data/' + r.path + '/' + s + a + '.mp3';
};

const audio = new Audio();
audio.addEventListener('ended', () => {
  const next = currentAyahIdx + 1;
  if (next < ayat.length) {
    currentAyahIdx = next;
    audio.src = getAyahSrc(ayat[next].number);
    audio.play().catch(() => {});
    updateNowPlaying();
  } else {
    isPlaying = false; currentAyahIdx = 0;
    updatePlayBtn(); updateNowPlaying(); updateHighlight();
  }
});

const fetchWithRetry = async (url, retries = 3) => {
  for (let i = 0; i < retries; i++) {
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) {
      if (i === retries - 1) throw e;
      await new Promise(res => setTimeout(res, 500 * (i + 1)));
    }
  }
};

async function loadAyat() {
  loading = true; error = null; ayat = []; currentAyahIdx = 0; isPlaying = false;
  audio.pause(); audio.removeAttribute('src');
  updatePlayBtn(); updateNowPlaying();
  ayahContent.innerHTML = '<div class="loading">جاري تحميل الآيات…</div>';
  const p = page();
  const sources = [
    'https://api.alquran.cloud/v1/surah/' + p.surahNumber + '/quran-uthmani',
    'https://api.alquran.cloud/v1/surah/' + p.surahNumber
  ];
  for (const url of sources) {
    try {
      const json = await fetchWithRetry(url);
      const all = json?.data?.ayahs ?? [];
      const slice = [];
      for (let n = p.startAyah; n <= p.endAyah; n++) {
        const a = all.find(x => x.numberInSurah === n);
        if (a && a.text) slice.push({ number: n, text: a.text });
      }
      if (slice.length > 0) {
        ayat = slice;
        loading = false;
        renderAyat();
        updatePlayBtn();
        return;
      }
    } catch (e) { /* try next source */ }
  }
  loading = false;
  error = 'تعذر تحميل الآيات. تحقق من الاتصال بالإنترنت.';
  renderAyat();
  updatePlayBtn();
}

function renderAyat() {
  if (loading) {
    ayahContent.innerHTML = '<div class="loading">جاري تحميل الآيات…</div>';
    return;
  }
  if (error) { ayahContent.innerHTML = '<div class="error">' + error + '</div>'; return; }
  if (page().surahNumber !== 1 && page().startAyah === 1 && page().surahNumber !== 9) {
    ayahContent.innerHTML = '<div class="bismallah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>' + buildAyahHtml();
  } else {
    ayahContent.innerHTML = buildAyahHtml();
  }
  updateHighlight();
}

function buildAyahHtml() {
  return '<div class="ayah-text">' + ayat.map((a, i) =>
    '<span class="ayah" data-i="' + i + '">' + a.text + ' <span class="ayah-number">﴿' + toAr(a.number) + '﴾</span></span>&nbsp;'
  ).join('') + '</div>';
}

function updateHighlight() {
  document.querySelectorAll('.ayah').forEach((sp, i) => {
    sp.classList.toggle('playing', isPlaying && !loading && i === currentAyahIdx);
  });
}

function updatePlayBtn() {
  playBtn.textContent = isPlaying ? '⏸ إيقاف' : '▶ استماع';
  const locked = loading || ayat.length === 0;
  playBtn.disabled = locked;
  prevBtn.disabled = locked || currentAyahIdx === 0;
  nextBtn.disabled = locked || currentAyahIdx >= ayat.length - 1;
}

function updateNowPlaying() {
  if (isPlaying && ayat[currentAyahIdx]) {
    nowPlaying.innerHTML = '🎧 الآن: آية <span>' + toAr(ayat[currentAyahIdx].number) + '</span>';
  } else nowPlaying.textContent = '';
}

playBtn.addEventListener('click', () => {
  if (!audio || (ayat.length === 0)) return;
  if (isPlaying) { audio.pause(); isPlaying = false; }
  else {
    if (!audio.src || audio.ended) {
      audio.src = getAyahSrc(ayat[currentAyahIdx].number);
    }
    audio.play().catch(() => {});
    isPlaying = true;
  }
  updatePlayBtn(); updateNowPlaying(); updateHighlight();
});

prevBtn.addEventListener('click', () => {
  if (ayat.length === 0) return;
  currentAyahIdx = Math.max(currentAyahIdx - 1, 0);
  audio.src = getAyahSrc(ayat[currentAyahIdx].number);
  if (isPlaying) audio.play().catch(() => {});
  updatePlayBtn(); updateNowPlaying(); updateHighlight();
});

nextBtn.addEventListener('click', () => {
  if (ayat.length === 0) return;
  currentAyahIdx = Math.min(currentAyahIdx + 1, ayat.length - 1);
  audio.src = getAyahSrc(ayat[currentAyahIdx].number);
  if (isPlaying) audio.play().catch(() => {});
  updatePlayBtn(); updateNowPlaying(); updateHighlight();
});

reciterSelect.addEventListener('change', () => {
  reciterId = reciterSelect.value;
  localStorage.setItem(RECITER_KEY, reciterId);
  const wasPlaying = isPlaying;
  audio.pause();
  const p = page();
  const currentAyah = ayat[currentAyahIdx];
  if (!currentAyah) return;
  audio.src = getAyahSrc(currentAyah.number);
  if (wasPlaying) { isPlaying = true; audio.play().catch(() => {}); }
  updatePlayBtn(); updateNowPlaying();
});

function renderPageInfo() {
  const p = page();
  let html = 'الصفحة <span>' + p.page + '</span> — سورة ' + p.surahName + ' (آية ' + p.startAyah + ' - ' + p.endAyah + ')';
  if (viewedPageIndex !== currentPageIndex) {
    html += '<span class="return-today" data-action="today">العودة لصفحة اليوم</span>';
  }
  pageBadge.innerHTML = html;
}

function goToday() { setPageIndex(currentPageIndex); }
function setPageIndex(idx) {
  if (idx < 0 || idx >= quranPages.length) return;
  viewedPageIndex = idx;
  renderPageInfo();
  renderMenu();
  loadAyat();
}

function renderMenu() {
  const available = quranPages.slice(0, Math.min(dayIndex + 1, quranPages.length));
  pageList.innerHTML = available.map((p, idx) =>
    '<div class="page-item' + (idx === viewedPageIndex ? ' active' : '') + '" data-page="' + idx + '">' +
      '<div class="pi-day">اليوم <span>' + (idx + 1) + '</span> — صفحة ' + p.page + '</div>' +
      '<div class="pi-sub">سورة ' + p.surahName + ' (آية ' + p.startAyah + ' - ' + p.endAyah + ')</div>' +
    '</div>'
  ).join('');
}
function pickPage(idx) { setPageIndex(idx); pageModal.classList.remove('open'); }

el('menuBtn').addEventListener('click', () => { renderMenu(); pageModal.classList.add('open'); });
el('closeMenu').addEventListener('click', () => pageModal.classList.remove('open'));
pageModal.addEventListener('click', e => { if (e.target === pageModal) pageModal.classList.remove('open'); });
pageList.addEventListener('click', e => {
  const item = e.target.closest('.page-item');
  if (item && item.dataset.page !== undefined) pickPage(parseInt(item.dataset.page, 10));
});
pageBadge.addEventListener('click', e => {
  if (e.target.closest('[data-action="today"]')) goToday();
});

function renderHadith() {
  const hadithIndex = dayIndex % hadiths.length;
  const h = hadiths[hadithIndex];
  el('hadithCounter').textContent = 'حديث اليوم رقم ' + (hadithIndex + 1) + ' من ' + hadiths.length;
  el('hadithText').textContent = 'قال رسول الله ﷺ: «' + h.text + '»';
  el('hadithMeta').innerHTML = 'الراوي: <b>' + h.narrator + '</b> &nbsp;·&nbsp; المصدر: <b>' + h.source + '</b>';
  el('explainBody').textContent = h.explanation || '';
  el('hadithSec').classList.remove('explain-open');
}

el('explainBtn').addEventListener('click', () => {
  const open = el('hadithSec').classList.toggle('explain-open');
  el('explainBtn').textContent = open ? '▲ إخفاء شرح الشيخ ابن باز' : '▼ عرض شرح الشيخ ابن باز رحمه الله';
});

renderPageInfo();
renderHadith();
loadAyat();

if (location.hash === '#recitations') {
  setTimeout(() => {
    const el2 = document.getElementById('quranSec');
    if (el2) el2.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 800);
}
</script>
</body>
</html>
