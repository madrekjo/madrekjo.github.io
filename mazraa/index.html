<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مزرعة مدارك">
<title>مزرعة مدارك جو 🌾 | لعبة الزراعة والدمج</title>
<meta name="description" content="لعبة مزرعة زراعة ودمج من مدارك جو: ازرع وحصد ودمج وبيع المحاصيل لتطوير مزرعتك!">
<link rel="icon" href="https://d.top4top.io/p_3816yfhp01.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#FFD700;--gold-dark:#B8860B;--gold-light:#FFF3B0;
  --deep:#0a0a0f;--surface:#111118;--surface2:#1a1a24;
  --accent:#4f46e5;--accent2:#7c3aed;--text:#f0f0f5;--muted:#888899;
  --border:rgba(255,255,255,.08);
  --green:#22c55e;--green-dim:rgba(34,197,94,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--deep);color:var(--text);font-family:'Cairo',sans-serif;min-height:100%;overflow-x:hidden}
body{padding-bottom:74px}
button{font-family:'Cairo',sans-serif;cursor:pointer;border:0;outline:0}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 15% 20%,rgba(79,70,229,.16)0%,transparent 55%),
  radial-gradient(ellipse at 85% 75%,rgba(34,197,94,.12)0%,transparent 55%)}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:10px}

header{position:sticky;top:0;z-index:40;background:rgba(10,10,15,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.hdr{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.05rem}
.logo .em{font-size:1.4rem}
.logo b{background:linear-gradient(90deg,var(--gold),#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent}
.hdr-stats{display:flex;gap:8px}
.stat-chip{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:800}
.stat-chip .ic{font-size:1rem}

nav{position:fixed;bottom:0;left:0;right:0;z-index:45;background:rgba(14,14,20,.96);border-top:1px solid var(--border);backdrop-filter:blur(12px)}
.nav-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav-btn{background:none;color:var(--muted);font-size:.66rem;font-weight:700;padding:9px 0 11px;display:flex;flex-direction:column;align-items:center;gap:2px;border-bottom:3px solid transparent;transition:.15s}
.nav-btn .ni{font-size:1.25rem}
.nav-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.nav-btn .bdg{background:#e11d48;color:#fff;font-size:.58rem;font-weight:900;border-radius:999px;padding:0 5px;margin-inline-start:2px;line-height:1.5}

.section{display:none;animation:pop .2s ease}
.section.active{display:block}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.page-title{font-size:1.15rem;font-weight:900;margin:8px 4px 10px;display:flex;align-items:center;gap:8px}
.page-title .t{color:var(--gold)}

/* ====== FARM ====== */
.farm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px}
@media(min-width:640px){.farm-grid{grid-template-columns:repeat(4,1fr)}}
.tile{aspect-ratio:1/1.05;border-radius:16px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#1c2433,#141a26);border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px;
  cursor:pointer;user-select:none;transition:.15s}
.tile:active{transform:scale(.96)}
.tile.locked{background:rgba(18,20,28,.7);cursor:pointer;border-color:rgba(255,255,255,.06)}
.tile.locked .lock{font-size:1.5rem;margin-bottom:4px;opacity:.75}
.tile.empty{background:linear-gradient(160deg,#1a212e,#131923);border-style:dashed;border-color:rgba(255,255,255,.12)}
.tile.empty .plus{font-size:1.4rem;color:var(--muted);margin-bottom:2px}
.tile.empty .hint{font-size:.6rem;color:#666a80;font-weight:700}
.tile.ready{border-color:rgba(255,215,0,.55);box-shadow:0 0 18px rgba(255,215,0,.22);animation:glow 1.1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 10px rgba(255,215,0,.15)}50%{box-shadow:0 0 22px rgba(255,215,0,.4)}}
.tile .crop-em{font-size:2rem;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.tile.growing .sp{width:100%;margin-top:6px;height:6px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.tile.growing .sp i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffb347);border-radius:999px;transition:width .3s linear;width:0}
.tile.growing .tt{font-size:.58rem;color:var(--muted);font-weight:700;margin-top:2px}
.tile .stage{font-size:1.1rem}
.tile .grow-stage{position:absolute;top:6px;inset-inline-start:6px;font-size:.9rem;opacity:.9}
.tile .tap-txt{font-size:.6rem;color:var(--gold);font-weight:900;margin-top:2px}
.tile .lvl-badge{position:absolute;top:6px;inset-inline-end:6px;background:rgba(0,0,0,.55);font-size:.6rem;font-weight:900;color:var(--gold);border-radius:999px;padding:1px 7px;border:1px solid rgba(255,215,0,.4)}
.tile .unlock-cost{position:absolute;bottom:6px;left:0;right:0;font-size:.62rem;font-weight:900;color:#ffd54f;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile .unlock-cost .e{font-size:1rem}

/* ====== SHOP ====== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px}
.card-title{font-weight:900;font-size:.95rem;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-title .em{font-size:1.2rem}
.shop-list{display:flex;flex-direction:column;gap:9px}
.shop-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
.shop-item .info{display:flex;align-items:center;gap:10px;min-width:0}
.shop-item .se{font-size:1.7rem}
.shop-item .nm{font-weight:800;font-size:.9rem}
.shop-item .sub{font-size:.65rem;color:var(--muted);font-weight:600}
.shop-item .lv-ig{font-size:.62rem;color:#6ee7a0;font-weight:800}
.shop-item .lockz{font-size:.62rem;color:#fca5a5;font-weight:800}
.buy-btn{flex-shrink:0;background:linear-gradient(135deg,var(--gold),#ffb347);color:#221900;font-weight:900;font-size:.85rem;border-radius:12px;padding:8px 14px;transition:.15s}
.buy-btn:active{transform:scale(.94)}
.buy-btn:disabled{background:#2a2a35;color:#565869;cursor:not-allowed}
.buy-btn .pp{font-size:.7rem;display:block;font-weight:800}

/* ====== UPGRADES ====== */
.up-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:11px 12px;margin-bottom:9px}
.up-item .info{min-width:0}
.up-item .nm{font-weight:800;font-size:.88rem;display:flex;align-items:center;gap:6px}
.up-item .ds{font-size:.66rem;color:var(--muted);font-weight:600;margin-top:2px}
.up-item .lv-dots{display:flex;gap:4px;margin-top:6px}
.up-item .dot{width:7px;height:7px;border-radius:999px;background:#2c2c3a}
.up-item .dot.on{background:var(--gold)}
.up-btn{flex-shrink:0;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;font-weight:900;font-size:.8rem;border-radius:12px;padding:9px 13px;min-width:76px}
.up-btn:disabled{background:#2a2a35;color:#565869;cursor:not-allowed}
.up-btn .pp{font-size:.68rem;display:block}

/* ====== INVENTORY ====== */
.inv-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.inv-slot-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-weight:800;font-size:.72rem;border-radius:10px;padding:6px 12px;transition:.15s}
.inv-slot-btn:active{transform:scale(.95)}
.inv-slot-btn.danger{color:#fca5a5}
.inv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:640px){.inv-grid{grid-template-columns:repeat(6,1fr)}}
.itembox{aspect-ratio:1/1;border-radius:14px;background:var(--surface2);border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative;transition:.12s;user-select:none}
.itembox:active{transform:scale(.93)}
.itembox.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(255,215,0,.35)}
.itembox.merging{animation:mergepop .45s ease}
@keyframes mergepop{0%{transform:scale(1.15)}100%{transform:scale(1)}}
.itembox .ie{font-size:1.75rem;line-height:1}
.itembox .il{font-size:.58rem;color:var(--gold);font-weight:900;background:rgba(0,0,0,.5);border-radius:999px;padding:0 7px;border:1px solid rgba(255,215,0,.35)}
.itembox .iv{font-size:.58rem;color:#9fb0c9;font-weight:700}
.itembox.empty-box{opacity:.4;border-style:dashed;background:transparent}
.itembox.empty-box .ie{font-size:1rem;color:#3c3c4d}
.inv-hint{font-size:.7rem;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:9px 12px;margin-bottom:10px;font-weight:600}
.sel-bar{position:sticky;bottom:68px;z-index:30;background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.sel-bar .nm{font-weight:800;font-size:.82rem;display:flex;align-items:center;gap:8px}
.sel-actions{display:flex;gap:7px}
.sell-btn{background:linear-gradient(135deg,#22c55e,#16a34a);color:#04220e;font-weight:900;font-size:.76rem;border-radius:11px;padding:7px 14px}
.merge-btn{background:linear-gradient(135deg,var(--gold),#ffb347);color:#221900;font-weight:900;font-size:.76rem;border-radius:11px;padding:7px 14px}
.cancel-btn{background:#2a2a35;color:#d7d7e2;font-weight:800;font-size:.76rem;border-radius:11px;padding:7px 12px}

/* ====== ORDERS ====== */
.order-card{background:linear-gradient(150deg,#1e2433,#151a26);border:1px solid var(--border);border-radius:16px;padding:13px 14px;margin-bottom:10px;position:relative;overflow:hidden}
.order-card::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--gold),#ffb347);opacity:.8}
.order-req-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.req-item{display:flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:5px 10px;font-weight:800;font-size:.8rem}
.req-item .re{font-size:1.25rem}
.req-item .ql{color:var(--muted);font-weight:700}
.order-mid{display:flex;justify-content:space-between;align-items:center;gap:8px}
.reward{display:flex;align-items:center;gap:6px;font-weight:900;color:#ffd54f;font-size:.95rem}
.xp{font-size:.62rem;color:#9fb0c9;font-weight:700;background:var(--surface2);border-radius:999px;padding:2px 9px;border:1px solid var(--border)}
.order-actions{display:flex;gap:8px;margin-top:9px}
.ful-btn{flex:1;background:linear-gradient(135deg,var(--gold),#ffb347);color:#221900;font-weight:900;font-size:.85rem;border-radius:12px;padding:9px}
.ful-btn:disabled{background:#2a2a35;color:#565869;cursor:not-allowed}
.skip-btn{background:#211f2e;border:1px solid var(--border);color:var(--muted);font-weight:800;font-size:.75rem;border-radius:12px;padding:9px 14px}
.order-empty{text-align:center;color:var(--muted);font-weight:700;font-size:.8rem;padding:26px 10px;border:1px dashed var(--border);border-radius:16px}
.order-empty .e{font-size:2.2rem;display:block;margin-bottom:6px}

/* ====== MODAL / TOAST ====== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal-bg.open{display:flex}
.modal-bg.center{align-items:center}
.modal{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--gold);border-radius:22px 22px 0 0;padding:18px;max-height:80vh;overflow-y:auto;animation:slideup .22s ease}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal.center{border-radius:22px;border:1px solid var(--border)}
.modal-title{font-weight:900;font-size:1rem;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.close-x{margin-inline-start:auto;background:none;color:var(--muted);font-size:1.2rem;font-weight:800}
.seed-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seed-card{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:10px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:.12s}
.seed-card:active{transform:scale(.95)}
.seed-card .se{font-size:1.5rem}
.seed-card .nm{font-weight:800;font-size:.8rem}
.seed-card .ct{font-size:.65rem;color:var(--muted);font-weight:700}
.seed-card.off{opacity:.45;pointer-events:none}
.toast-wrap{position:fixed;top:64px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:7px;z-index:80;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--gold);color:var(--text);font-weight:800;font-size:.78rem;border-radius:999px;padding:8px 18px;box-shadow:0 8px 26px rgba(0,0,0,.5);animation:toastUp .25s ease;display:flex;align-items:center;gap:7px}
.toast.err{border-color:#f43f5e}
@keyframes toastUp{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* welcome */
.welcome-icon{font-size:2.6rem;text-align:center;margin:4px 0 8px}
.welcome-steps{display:flex;flex-direction:column;gap:9px;margin:10px 0 14px}
.w-step{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:9px 11px;font-size:.78rem;font-weight:600;line-height:1.6}
.w-step .n{flex-shrink:0;width:22px;height:22px;border-radius:999px;background:linear-gradient(135deg,var(--gold),#ffb347);color:#221900;font-weight:900;font-size:.72rem;display:flex;align-items:center;justify-content:center}
.cta-btn{width:100%;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-weight:900;font-size:.95rem;border-radius:14px;padding:12px;margin-top:6px}

.level-banner{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px 12px;margin-bottom:12px}
.level-banner .lm{font-size:1.4rem}
.level-banner .lt{font-weight:900;font-size:.85rem;}
.level-bar{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.level-bar i{display:block;height:100%;background:linear-gradient(90deg,#a855f7,#7c3aed);border-radius:999px;transition:width .3s}
.level-banner .lp{font-size:.68rem;color:var(--muted);font-weight:800}

.foot-note{text-align:center;color:#565869;font-size:.68rem;font-weight:700;padding:18px 10px 8px}
.foot-note a{color:#8b8bf0;text-decoration:none}
.danger-link{color:#f87171 !important}
</style>
</head>
<body>
<div class="bg"></div>

<header>
  <div class="hdr">
    <div class="logo"><span class="em">🌾</span><span>مزرعة <b>مدارك جو</b></span></div>
    <div class="hdr-stats">
      <div class="stat-chip"><span class="ic">🪙</span><span id="coinVal">0</span></div>
      <div class="stat-chip" onclick="openLevelModal()"><span class="ic">⭐</span><span id="lvlVal">1</span></div>
    </div>
  </div>
</header>

<div class="wrap">
  <!-- LAND -->
  <section id="sect-farm" class="section active">
    <div class="page-title"><span>🚜</span><span class="t">أرض المزرعة</span></div>
    <div class="farm-grid" id="farmGrid"></div>
    <div style="height:8px"></div>
    <div class="inv-hint">💡 اضغط على أرض <b>فارغة</b> لتختار بذرة وتزرعها، وعلى المحصول <b>الناضج</b> لحصاده.</div>
  </section>

  <!-- SHOP -->
  <section id="sect-shop" class="section">
    <div class="page-title"><span>🛒</span><span class="t">متجر البذور</span></div>
    <div class="card">
      <div class="card-title"><span class="em">🌱</span> بذور للبيع</div>
      <div class="shop-list" id="shopList"></div>
    </div>
    <div class="page-title" style="margin-top:6px"><span>⚡</span><span class="t">الترقيات</span></div>
    <div class="card">
      <div class="up-list" id="upShopList"></div>
    </div>
  </section>

  <!-- INVENTORY -->
  <section id="sect-inv" class="section">
    <div class="page-title"><span>📦</span><span class="t">المخزن <span class="badge">(دمج)</span></span></div>
    <div class="inv-head">
      <div class="inv-hint" style="margin:0">اضغط على بندين <b>متطابقين</b> لدمجهما إلى مستوى أعلى.</div>
      <div style="display:flex;gap:7px;flex-shrink:0">
        <button class="inv-slot-btn danger" onclick="sellAll()">بيع الكل</button>
        <button class="inv-slot-btn" onclick="sortInv()">ترتيب ↕</button>
      </div>
    </div>
    <div class="inv-grid" id="invGrid"></div>
    <div id="selBar"></div>
  </section>

  <!-- ORDERS -->
  <section id="sect-orders" class="section">
    <div class="page-title"><span>🧾</span><span class="t">الطلبات</span></div>
    <div id="ordersList"></div>
  </section>
</div>

<nav>
  <div class="nav-inner">
    <button class="nav-btn active" data-tab="farm"><span class="ni">🚜</span>المزرعة</button>
    <button class="nav-btn" data-tab="shop"><span class="ni">🛒</span>المتجر</button>
    <button class="nav-btn" data-tab="inv"><span class="ni">📦</span>المخزن<span id="invBdg" class="bdg" style="display:none"></span></button>
    <button class="nav-btn" data-tab="orders"><span class="ni">🧾</span>الطلبات<span id="ordBdg" class="bdg">0</span></button>
  </div>
</nav>

<div class="toast-wrap" id="toastWrap"></div>

<!-- seed chooser modal -->
<div class="modal-bg" id="seedModal">
  <div class="modal">
    <div class="modal-title"><span>🌱</span> اختر البذرة للزراعة<button class="close-x" onclick="closeSeedModal()">✕</button></div>
    <div class="seed-grid" id="seedGrid"></div>
    <div style="height:8px"></div>
    <div class="card" style="margin:0">
      <div class="card-title" style="margin-bottom:6px"><span>🏪</span> أو اشترِ بذرة جديدة</div>
      <div class="shop-list" id="seedShopList"></div>
    </div>
  </div>
</div>

<!-- level modal -->
<div class="modal-bg center" id="lvlModal">
  <div class="modal center">
    <div class="modal-title"><span>⭐</span> مستوى اللاعب<button class="close-x" onclick="closeX('lvlModal')">✕</button></div>
    <div id="lvlBody"></div>
  </div>
</div>

<script>
'use strict';
var LS_KEY='madarek-farm-v1';
var MAX_LEVEL=8;

var CROPS={
  carrot:{name:'جزر',emoji:'🥕',grow:25, base:3, seed:4,  unlockLv:1},
  wheat: {name:'قمح', emoji:'🌾',grow:50, base:6, seed:9,  unlockLv:2},
  tomato:{name:'طماطم',emoji:'🍅',grow:95, base:11,seed:16, unlockLv:3},
  corn:  {name:'ذرة', emoji:'🌽',grow:170,base:20,seed:30, unlockLv:4},
  grapes:{name:'عنب', emoji:'🍇',grow:300,base:38,seed:55, unlockLv:5},
  potato:{name:'بطاطا',emoji:'🥔',grow:520,base:70,seed:100,unlockLv:6}
};
var CROP_KEYS=Object.keys(CROPS);
var TILES=24;
var BASE_TILES=12;
var CAP=24;
var ORDER_SLOTS=3;

var UPGRADES={
  speed:{name:'🚀 نمو أسرع',ico:false,desc:'يقلل وقت نمو المحاصيل 8% لكل مستوى',max:5,cost:120},
  reward:{name:'💰 عائد الطلبات',ico:false,desc:'يزيد قيمة مكافأة الطلبات 20% لكل مستوى',max:5,cost:160},
  discount:{name:'🏷️ بذور مخفضة',ico:false,desc:'يخفض أسعار البذور 9% لكل مستوى',max:5,cost:100},
  capacity:{name:'📦 مخزن أكبر',ico:false,desc:'يزيد سعة المخزن 6 خانات لكل مستوى',max:2,cost:260},
  orderslots:{name:'🧾 طاولة طلبات',ico:false,desc:'يزيد الطلبات المتزامنة بمقدار 1 لكل مستوى',max:2,cost:420}
};

var state=null;
var selectedA=null;
var pendingTile=null;
var soundOn=true;

function seedCost(crop){var d=state.upgrades.discount||0;return Math.max(1,Math.round(CROPS[crop].seed*Math.pow(0.91,d)));}
function growthSec(crop){var s=state.upgrades.speed||0;return Math.max(3,Math.round(CROPS[crop].grow*Math.pow(0.92,s)));}
function itemValue(crop,level){var b=CROPS[crop].base*Math.pow(1.95,level-1);return Math.round(b);}
function rewardMult(){return (state.upgrades.reward||0)*0.2+1;}
function invCap(){return CAP+(state.upgrades.capacity||0)*6;}
function orderSlots(){return ORDER_SLOTS+(state.upgrades.orderslots||0);}
function xpToNext(lv){return Math.round(40*Math.pow(lv,1.35));}
function levelOf(xp){var l=1;while(xp>=xpToNext(l)){xp-=xpToNext(l);l++;}return {lvl:l,into:xp,need:xpToNext(l)};}

function newState(){
  var tiles=[];
  for(var i=0;i<TILES;i++){tiles.push({locked:i>=BASE_TILES,unlockCost:80+Math.floor((i-BASE_TILES)/6)*260});}
  return {coins:120,xp:0,seeds:{carrot:2,wheat:0,tomato:0,corn:0,grapes:0,potato:0},
    tiles:tiles,inv:[],orders:[],upgrades:{speed:0,reward:0,discount:0,capacity:0,orderslots:0},
    seenWelcome:false,orderSeq:0};
}

function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function load(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(raw){state=JSON.parse(raw);}
  }catch(e){state=null;}
  if(!state){state=newState();}
  if(!state.seeds||!state.tiles||!state.inv||!state.orders){state=newState();}
  if(!state.tiles||state.tiles.length!==24){var t=[];for(var i=0;i<TILES;i++){t.push((state.tiles&&state.tiles[i])||{locked:i>=BASE_TILES,unlockCost:80+Math.floor((i-BASE_TILES)/6)*260});}state.tiles=t;}
  if(state.orders&&state.orders.length<orderSlots()){fillOrders();}
  selectedA=null;pendingTile=null;
}

function $id(x){return document.getElementById(x);}
function fmt(x){return Math.round(x).toLocaleString('en-US');}

function toast(msg,isErr){
  var w=$id('toastWrap');var t=document.createElement('div');t.className='toast'+(isErr?' err':'');
  t.textContent=msg;w.appendChild(t);
  setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .3s';},1700);
  setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},2100);
}

var AC=null;
function beep(f1,f2,dur){if(!soundOn)return;try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  var o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.value=f1;o.connect(g);g.connect(AC.destination);
  var t=AC.currentTime;g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  if(f2){o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);}
  o.start(t);o.stop(t+dur+0.02);
}catch(e){}}
function sfx(kind){if(kind==='plant')beep(520,660,.12);else if(kind==='harvest')beep(440,880,.18);else if(kind==='merge')beep(330,990,.22);else if(kind==='coin')beep(660,990,.25);else if(kind==='error')beep(220,160,.18);else if(kind==='buy')beep(700,900,.14);}

function renderAll(){
  var l=levelOf(state.xp);
  $id('coinVal').textContent=fmt(state.coins);
  $id('lvlVal').textContent=l.lvl;
  if($id('lvlBody').textContent!=='')renderLevelModal();
  renderFarm();renderShop();renderInv();renderOrders();
}

function tabTo(t){
  document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active');});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  $id('sect-'+t).classList.add('active');
  document.querySelector('.nav-btn[data-tab="'+t+'"]').classList.add('active');
}
document.querySelectorAll('.nav-btn').forEach(function(b){
  b.addEventListener('click',function(){tabTo(b.getAttribute('data-tab'));});
});

/* ============ FARM ============ */
function renderFarm(){
  var g=$id('farmGrid');g.innerHTML='';
  state.tiles.forEach(function(tile,i){
    var d=document.createElement('div');d.className='tile';
    if(tile.locked){
      d.className+=' locked';
      d.innerHTML='<span class="lock">🔒</span><div class="unlock-cost"><span class="e">🪙</span>'+fmt(tile.unlockCost)+'</div>';
      d.addEventListener('click',function(){unlockTile(i);});
    }else if(!tile.crop){
      d.className+=' empty';
      d.innerHTML='<span class="plus">+</span>'+(pendingTile===i?'<span class="hint">اختر بذرة…</span>':'<span class="hint">ازرع</span>');
      d.addEventListener('click',function(){openSeedModal(i);});
    }else{
      var now=Date.now(),eCrop=CROPS[tile.crop];
      var pct=(now-tile.plantedAt)/tile.grow;
      if(pct>=1){
        d.className+=' ready';
        d.innerHTML='<div class="lvl-badge">L'+tile.level+'</div><div class="crop-em">'+eCrop.emoji+'</div><div class="tap-txt">احصد! 👆</div>';
        d.addEventListener('click',function(){harvest(i);});
      }else{
        d.className+=' growing';
        var st=stageOf(pct);
        d.innerHTML='<span class="grow-stage">'+st+'</span><span class="crop-em">'+eCrop.emoji+'</span><div class="sp"><i style="width:'+(pct*100)+'%"></i></div><div class="tt">'+timeLeft(pct*tile.grow)+'</div>';
      }
    }
    g.appendChild(d);
  });
}
function stageOf(p){
  var seeds=['🌰','🌱','🌿','🪴','🌻'];
  return seeds[Math.min(4,Math.floor(p*5))];
}
function timeLeft(ms){
  ms=Math.max(0,ms);
  var s=Math.ceil(ms/1000);
  if(s<60)return s+'ث';
  var m=Math.floor(s/60),r=s%60;
  if(m<60)return m+'د '+r+'ث';
  var h=Math.floor(m/60);m=m%60;
  return h+'س '+m+'د';
}

function plantAt(tileIdx,crop){
  var tile=state.tiles[tileIdx];
  if(tile.locked)return;
  if(tile.crop)return;
  if(!state.seeds[crop]||state.seeds[crop]<=0){toast('لا تملك بذرة '+CROPS[crop].name+'!','err');return;}
  state.seeds[crop]--;
  tile.crop=crop;tile.level=1;tile.plantedAt=Date.now();tile.grow=growthSec(crop)*1000;
  pendingTile=null;
  sfx('plant');toast('زرعت '+CROPS[crop].name+' 🌱');
  save();renderAll();
}
function harvest(i){
  var tile=state.tiles[i];if(!tile||tile.locked||!tile.crop)return;
  var now=Date.now();
  if(now-tile.plantedAt<tile.grow)return;
  if(state.inv.length>=invCap()){toast('المخزن ممتلئ! وسّعه من الترقيات','err');sfx('error');return;}
  state.inv.push({id:genId(),crop:tile.crop,level:tile.level});
  tile.crop=null;tile.level=null;tile.plantedAt=null;tile.grow=null;
  sfx('harvest');toast('حصاد '+CROPS[state.inv[state.inv.length-1].crop].name+'! 🧺');
  save();renderAll();
}
function unlockTile(i){
  var tile=state.tiles[i];
  if(!tile.locked)return;
  if(state.coins<tile.unlockCost){toast('ما عندك فلوس كافية!','err');sfx('error');return;}
  state.coins-=tile.unlockCost;tile.locked=false;
  sfx('buy');toast('فتحت أرض جديدة! 🚜');
  save();renderAll();
}

/* ============ SHOP ============ */
function renderShop(){
  var l=levelOf(state.xp).lvl;
  var sl=$id('shopList');sl.innerHTML='';
  CROP_KEYS.forEach(function(c){
    var ck=CROPS[c];
    var unlocked=l>=ck.unlockLv;
    var d=document.createElement('div');d.className='shop-item';
    var info='<div class="info"><span class="se">'+ck.emoji+'</span><div><div class="nm">'+ck.name+'</div>'+
      (unlocked?'<div class="sub">نمو: '+timeLeft(growthSec(c)*1000)+' • قيمة L1: 🪙'+itemValue(c,1)+'</div>':'<div class="lockz">🔒 يُفتح بالمستوى '+ck.unlockLv+'</div>')+'</div></div>';
    var btn;
    if(!unlocked){
      btn='<button class="buy-btn" disabled><span class="pp">مغلق</span></button>';
    }else{
      btn='<button class="buy-btn" data-buy="'+c+'"><span class="pp">🪙'+fmt(seedCost(c))+'</span>شراء</button>';
    }
    d.innerHTML=info+btn;
    sl.appendChild(d);
  });
  sl.querySelectorAll('[data-buy]').forEach(function(b){
    b.addEventListener('click',function(){buySeed(b.getAttribute('data-buy'));});
  });

  var ul=$id('upShopList');ul.innerHTML='';
  Object.keys(UPGRADES).forEach(function(k){
    var u=UPGRADES[k];var lv=state.upgrades[k]||0;var maxed=lv>=u.max;
    var cost=Math.round(u.cost*Math.pow(2.1,lv));
    var d=document.createElement('div');d.className='up-item';
    var dots='';for(var i=0;i<u.max;i++){dots+='<span class="dot'+(i<lv?' on':'')+'"></span>';}
    d.innerHTML='<div class="info"><div class="nm">'+u.name+' <span style="color:var(--muted);font-size:.65rem">L'+lv+'/'+u.max+'</span></div>'+
      '<div class="ds">'+u.desc+'</div><div class="lv-dots">'+dots+'</div></div>';
    var btn;
    if(maxed){btn='<button class="up-btn" disabled>🔥 كامل</button>';}
    else{btn='<button class="up-btn" data-up="'+k+'"><span class="pp">🪙'+fmt(cost)+'</span>ترقية</button>';}
    d.innerHTML+=btn;
    ul.appendChild(d);
  });
  ul.querySelectorAll('[data-up]').forEach(function(b){
    b.addEventListener('click',function(){buyUpgrade(b.getAttribute('data-up'));});
  });
}
function buySeed(c){
  var cost=seedCost(c);var l=levelOf(state.xp).lvl;
  if(l<CROPS[c].unlockLv){toast('هذه البذرة غير مفتوحة بعد','err');return;}
  if(state.coins<cost){toast('ما عندك فلوس كافية!','err');sfx('error');return;}
  state.coins-=cost;state.seeds[c]=(state.seeds[c]||0)+1;
  sfx('buy');toast('اشتريت بذرة '+CROPS[c].name+' 🌱');
  save();renderAll();
  if($id('seedModal').classList.contains('open'))renderSeedModal();
}
function buyUpgrade(k){
  var u=UPGRADES[k];var lv=state.upgrades[k]||0;
  if(lv>=u.max){toast('الترقية وصلت أقصى مستوى','err');return;}
  var cost=Math.round(u.cost*Math.pow(2.1,lv));
  if(state.coins<cost){toast('ما عندك فلوس كافية!','err');sfx('error');return;}
  state.upgrades[k]=lv+1;state.coins-=cost;
  sfx('coin');toast('رُقّيت: '+u.name.split(' ')[1]+' ✓');
  fillOrders();save();renderAll();
}

/* ============ SEED MODAL ============ */
function openSeedModal(i){
  if(state.tiles[i].locked){toast('الأرض مقفلة، افتحها أولاً','err');return;}
  pendingTile=i;renderSeedModal();
  $id('seedModal').classList.add('open');
  renderFarm();
}
function closeSeedModal(){pendingTile=null;$id('seedModal').classList.remove('open');renderFarm();}
function renderSeedModal(){
  var g=$id('seedGrid');g.innerHTML='';
  var l=levelOf(state.xp).lvl;
  CROP_KEYS.forEach(function(c){
    var ck=CROPS[c];var has=state.seeds[c]||0;
    var unlocked=l>=ck.unlockLv;
    var d=document.createElement('div');d.className='seed-card'+(has>0?'':' off');
    d.innerHTML='<span class="se">'+ck.emoji+'</span><div><div class="nm">'+ck.name+'</div><div class="ct">عندك: '+has+(unlocked?'':' • 🔒')+'</div></div>';
    if(has>0)d.addEventListener('click',function(){plantAt(pendingTile,c);closeSeedModal();});
    g.appendChild(d);
  });
  var sl=$id('seedShopList');sl.innerHTML='';
  CROP_KEYS.forEach(function(c){
    var ck=CROPS[c];var l2=levelOf(state.xp).lvl;
    if(l2<ck.unlockLv)return;
    var d=document.createElement('div');d.className='shop-item';
    d.innerHTML='<div class="info"><span class="se">'+ck.emoji+'</span><div class="nm">'+ck.name+'</div></div>'+
      '<button class="buy-btn" data-sb="'+c+'"><span class="pp">🪙'+fmt(seedCost(c))+'</span>شراء</button>';
    sl.appendChild(d);
  });
  sl.querySelectorAll('[data-sb]').forEach(function(b){
    b.addEventListener('click',function(){
      if(pendingTile===null)return;
      buySeed(b.getAttribute('data-sb'));
    });
  });
}

/* ============ INVENTORY ============ */
var INV_SORT='new';
function renderInv(){
  var g=$id('invGrid');g.innerHTML='';
  state.inv.forEach(function(it,idx){
    var ck=CROPS[it.crop];var val=itemValue(it.crop,it.level);
    var d=document.createElement('div');d.className='itembox';
    if(selectedA===idx)d.className+=' sel';
    d.innerHTML='<span class="ie">'+ck.emoji+'</span><span class="il">L'+it.level+'</span><span class="iv">🪙'+fmt(val)+'</span>';
    d.addEventListener('click',function(){invClick(idx,d);});
    g.appendChild(d);
  });
  var empty=invCap()-state.inv.length;
  for(var i=0;i<empty;i++){
    var e=document.createElement('div');e.className='itembox empty-box';
    e.innerHTML='<span class="ie">＋</span>';
    g.appendChild(e);
  }
  renderSelBar();
  $id('invBdg').style.display='none';
}
function invClick(idx,el){
  if(selectedA===null){selectedA=idx;el.classList.add('sel');sfx('plant');renderSelBar();return;}
  if(selectedA===idx){selectedA=null;renderInv();return;}
  var a=state.inv[selectedA],b=state.inv[idx];
  if(a.crop===b.crop&&a.level===b.level&&a.level<MAX_LEVEL){
    state.inv.splice(idx,1);
    state.inv.splice(selectedA,1);
    state.inv.unshift({id:genId(),crop:a.crop,level:a.level+1});
    selectedA=null;
    sfx('merge');
    toast('دمج: '+CROPS[a.crop].emoji+' ×2 → L'+(a.level+1)+' 🎉');
    save();renderInv();
  }else{
    selectedA=idx;renderInv();
  }
}
function renderSelBar(){
  var bar=$id('selBar');
  if(selectedA===null||!state.inv[selectedA]){bar.innerHTML='';return;}
  var it=state.inv[selectedA];var ck=CROPS[it.crop];
  var val=itemValue(it.crop,it.level);
  var mergeable=null;
  for(var i=0;i<state.inv.length;i++){if(i===selectedA)continue;var x=state.inv[i];if(x.crop===it.crop&&x.level===it.level){mergeable=x;break;}}
  var b='<div class="sel-bar"><div class="nm"><span style="font-size:1.4rem">'+ck.emoji+'</span><span><b>'+ck.name+'</b> • L'+it.level+' • 🪙'+fmt(val)+'</span></div>'+
    '<div class="sel-actions">';
  if(mergeable&&it.level<MAX_LEVEL)b+='<button class="merge-btn" onclick="mergeSelected()">دمج ↩</button>';
  b+='<button class="sell-btn" onclick="sellSelected()">بيع 🪙</button>'+
    '<button class="cancel-btn" onclick="selectedA=null;renderInv()">إلغاء</button></div></div>';
  bar.innerHTML=b;
}
function mergeSelected(){
  if(selectedA===null)return;
  var a=state.inv[selectedA];
  var bi=-1;
  for(var i=0;i<state.inv.length;i++){if(i===selectedA)continue;var x=state.inv[i];if(x.crop===a.crop&&x.level===a.level){bi=i;break;}}
  if(bi<0)return;
  state.inv.splice(bi,1);
  state.inv.splice(selectedA,1);
  state.inv.unshift({id:genId(),crop:a.crop,level:a.level+1});
  selectedA=null;
  sfx('merge');toast('دمج ناجح! 🎉');
  save();renderInv();
}
function sellSelected(){
  if(selectedA===null)return;
  var it=state.inv[selectedA];var val=itemValue(it.crop,it.level);
  state.inv.splice(selectedA,1);state.coins+=val;selectedA=null;
  sfx('coin');
  gainXp(Math.round(val/2));
  toast('بعت '+CROPS[it.crop].name+' بـ 🪙'+fmt(val)+'!');
  save();renderAll();
}
function sellAll(){
  if(!state.inv.length){toast('المخزن فارغ','err');return;}
  var sum=0;var xp=0;
  state.inv.forEach(function(it){sum+=itemValue(it.crop,it.level);xp+=Math.round(itemValue(it.crop,it.level)/3);});
  state.coins+=sum;state.inv=[];selectedA=null;
  sfx('coin');toast('بعت الكل بـ 🪙'+fmt(sum)+'!');
  gainXp(xp);
  save();renderAll();
}
function sortInv(){
  state.inv.sort(function(x,y){return y.level-x.level||(x.crop<y.crop?-1:1);});
  selectedA=null;sfx('plant');save();renderInv();
}
function genId(){return (state.orderSeq++)+'_'+Date.now()+'_'+Math.floor(Math.random()*999);}

/* ============ ORDERS ============ */
var ORDER_LEVEL_MAX=6;
function fillOrders(){
  state.orders=state.orders||[];
  var need=orderSlots()-state.orders.length;
  var lvl=levelOf(state.xp).lvl;
  for(var i=0;i<need;i++){state.orders.push(genOrder(lvl));}
}
function genOrder(plvl){
  var unlocked=CROP_KEYS.filter(function(c){return plvl>=CROPS[c].unlockLv;});
  var crop=unlocked[Math.floor(Math.random()*unlocked.length)];
  var m=Math.min(ORDER_LEVEL_MAX,Math.max(1,Math.floor(Math.random()*(plvl+1))+1));
  var qty=1+Math.floor(Math.random()*3);
  var base=itemValue(crop,m)*qty*1.6*rewardMult();
  return {id:genId(),crop:crop,level:m,qty:qty,reward:Math.round(base)};
}
function renderOrders(){
  var l=$id('ordersList');
  var count=state.orders.length;
  $id('ordBdg').textContent=count;
  if(!count){
    l.innerHTML='<div class="order-empty"><span class="e">🧾</span>لا توجد طلبات حالياً…</div>';
    return;
  }
  l.innerHTML='';
  state.orders.forEach(function(o){
    var ck=CROPS[o.crop];var have=0;
    state.inv.forEach(function(it){if(it.crop===o.crop&&it.level===o.level)have++;});
    var ok=have>=o.qty;
    var req='';
    for(var i=0;i<o.qty;i++){req+='<span class="req-item"><span class="re">'+ck.emoji+'</span>'+ck.name+' <span style="color:var(--gold)">L'+o.level+'</span></span>';}
    var d=document.createElement('div');d.className='order-card';
    d.innerHTML='<div class="order-req-row">'+req+'</div>'+
      '<div class="order-mid"><span class="reward">🪙 '+fmt(o.reward)+'</span><span class="xp">⭐ +'+fmt(Math.round(o.reward/2))+' خبرة</span></div>'+
      '<div class="order-actions"><button class="ful-btn" data-ful="'+o.id+'">تسليم الطلب 	✅</button>'+
      '<button class="skip-btn" data-skip="'+o.id+'">تخطي (🪙2)</button></div>';
    l.appendChild(d);
    var fb=d.querySelector('[data-ful]');
    fb.disabled=!ok;
    if(!ok)fb.textContent='محصول ناقص ('+Math.max(0,o.qty-have)+' / '+o.qty+')';
    fb.addEventListener('click',function(){fulfill(o.id);});
    d.querySelector('[data-skip]').addEventListener('click',function(){skipOrder(o.id);});
  });
}
function fulfill(oid){
  var o=state.orders.find(function(x){return x.id===oid;});
  if(!o)return;
  var need=o.qty;
  for(var i=state.inv.length-1;i>=0&&need>0;i--){
    var it=state.inv[i];
    if(it.crop===o.crop&&it.level===o.level){state.inv.splice(i,1);need--;}
  }
  if(need>0){toast('محاصيل ناقصة!','err');sfx('error');renderOrders();return;}
  state.coins+=o.reward;
  var xp=Math.round(o.reward/2);
  state.orders=state.orders.filter(function(x){return x.id!==oid;});
  fillOrders();
  sfx('coin');
  gainXp(xp);
  toast('شكراً! ربحت 🪙'+fmt(o.reward)+' 🎉');
  save();renderAll();
}
function skipOrder(oid){
  if(state.coins<2){toast('ما عندك فلوس للتخطي','err');sfx('error');return;}
  state.coins-=2;
  state.orders=state.orders.filter(function(x){return x.id!==oid;});
  fillOrders();
  sfx('buy');toast('طلب جديد وصل! 📋');
  save();renderAll();
}

/* ============ XP / LEVEL ============ */
function gainXp(amount){
  var was=levelOf(state.xp).lvl;
  state.xp+=(amount||0);
  var nowL=levelOf(state.xp).lvl;
  if(nowL>was){
    var bonus=nowL*25;
    state.coins+=bonus;
    toast('✨ ترقية المستوى! وصلت المستوى '+nowL+' وربحت 🪙'+fmt(bonus),false);
    sfx('coin');
    fillOrders();
  }
}
function openLevelModal(){renderLevelModal();$id('lvlModal').classList.add('open');}
function renderLevelModal(){
  var l=levelOf(state.xp);
  var pct=l.into/l.need*100;
  var unlocked=[];
  CROP_KEYS.forEach(function(c){if(l.lvl>=CROPS[c].unlockLv)unlocked.push(CROPS[c].emoji);});
  $id('lvlBody').innerHTML=
    '<div class="level-banner" style="margin:0"><span class="lm">⭐</span><div class="lt">المستوى '+l.lvl+'</div>'+
    '<div class="level-bar"><i style="width:'+pct+'%"></i></div><div class="lp">'+l.into+'/'+l.need+'</div></div>'+
    '<div class="card" style="margin-top:10px"><div class="card-title" style="margin-bottom:8px"><span class="em">🌾</span> المحاصيل المفتوحة</div>'+
    '<div style="font-size:1.6rem;letter-spacing:4px">'+(unlocked.join(' ')||'—')+'</div>'+
    '<div style="font-size:.68rem;color:var(--muted);font-weight:700;margin-top:6px">تكسب الخبرة من تنفيذ الطلبات وبيع المحاصيل.</div></div>';
}
function closeX(id){$id(id).classList.remove('open');}
document.querySelectorAll('.modal-bg').forEach(function(m){
  m.addEventListener('click',function(e){if(e.target===m)m.classList.remove('open');});
});

/* ============ WELCOME ============ */
function showWelcome(){
  var b=document.createElement('div');b.className='modal-bg center open';b.id='welcomeModal';
  var steps=['افتح <b>المتجر</b> واشترِ بذور جزر، ثم ارجع للمزرعة واضغط على أرض فارغة لتزرعها',
    'انتظر حتى ينضج المحصول (يتألق) ثم اضغط عليه للحصاد',
    'في <b>المخزن</b> اضغط على حبتين متطابقتين لدمجهما وإنتاج مستوى أعلى',
    'نفّذ <b>الطلبات</b> واجمع الفلوس لشراء أراضٍ وترقيات جديدة'];
  var inner='<div class="modal center"><div class="welcome-icon">🌾👨‍🌾</div>'+
    '<div class="modal-title" style="justify-content:center;margin:0 0 4px"><b>أهلاً وحياك في مزرعة المدارك!</b></div>'+
    '<div style="text-align:center;color:var(--muted);font-size:.78rem;font-weight:700">طوّر مزرعتك بالزراعة والدمج وطلبات الزبائن</div>'+
    '<div class="welcome-steps">';
  steps.forEach(function(s,i){inner+='<div class="w-step"><span class="n">'+(i+1)+'</span><span>'+s+'</span></div>';});
  inner+='</div><button class="cta-btn" id="welcomeGo">نبدأ الزراعة! 🚜</button></div>';
  b.innerHTML=inner;
  document.body.appendChild(b);
  b.querySelector('#welcomeGo').addEventListener('click',function(){b.remove();state.seenWelcome=true;save();});
}
function resetGame(){
  if(confirm('تأكيد: سيتم مسح كل تقدمك والبدء من جديد؟')){
    localStorage.removeItem(LS_KEY);
    state=newState();
    save();renderAll();
    toast('بدء جديد! 🌱');selectedA=null;fillOrders();
  }
}

/* ============ BOOT ============ */
load();
fillOrders();
if(!state.seenWelcome){setTimeout(showWelcome,400);}
renderAll();
setInterval(function(){renderFarm();renderInv();renderOrders();},500);
setInterval(save,5000);
if('serviceWorker'in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){});}
</script>
</body>
</html>
