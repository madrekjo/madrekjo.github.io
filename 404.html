<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مدارك جو</title>
    <meta name="robots" content="noindex,nofollow">
    <script>
      /* ============================================================
         404.html — حاجز (fallback) لصفحة غير موجودة على GitHub Pages
         ------------------------------------------------------------
         ذاتي التحديث بالكامل: يقرأ /<app>/index.html ديناميكياً
         لاستخراج روابط الأصول (js/css) مهما تغيّرت أسماؤها بعد كل
         build. لا توجد أسماء أصول صلبة هنا.
         - /achievement -> تطبيق الإنجاز (SPA)
         - /chat        -> تطبيق الدردشة (SPA)
         - /anon        -> تطبيق أنا مجهول (SPA)
         - /talaawat    -> تطبيق التلاوات (SPA)
         - غير ذلك       -> يرجع للصفحة الرئيسية
         ============================================================ */
      (function () {
        try {
          var p = window.location.pathname;
          if (p.indexOf('/achievement') !== 0 && p.indexOf('/chat') !== 0 && p.indexOf('/anon') !== 0 && p.indexOf('/talaawat') !== 0) {
            window.location.replace('/');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* تحميل أصول التطبيق ديناميكياً من /<app>/index.html
         — ذاتي تماماً، لا يحتاج أي تحديث يدوي بعد أي build. */
      (function () {
        var p = window.location.pathname;
        var app = null;
        if (p.indexOf('/achievement') === 0) app = 'achievement';
        else if (p.indexOf('/chat') === 0) app = 'chat';
        else if (p.indexOf('/anon') === 0) app = 'anon';
        else if (p.indexOf('/talaawat') === 0) app = 'talaawat';
        if (!app) return;

        function inject(urls) {
          for (var i = 0; i < urls.length; i++) {
            var u = urls[i];
            if (/\.css(\?|$)/.test(u)) {
              var l = document.createElement('link');
              l.rel = 'stylesheet';
              l.href = u;
              document.head.appendChild(l);
            } else if (/\.js(\?|$)/.test(u)) {
              var s = document.createElement('script');
              s.type = 'module';
              s.src = u;
              s.crossOrigin = 'anonymous';
              document.head.appendChild(s);
            }
          }
        }

        /* احتفظ بأصول index.html في ذاكرة (لكل app) لتفادي إعادة جلبها
           عند كل تحديث صفحة عميقة — مع إمكانية التحديث عند عدم الحاجة. */
        var x = new XMLHttpRequest();
        x.open('GET', '/' + app + '/index.html');
        x.onload = function () {
          try {
            var html = x.responseText || '';
            var urls = [];
            var re = /(?:src|href)="([^"]+\.(?:js|css)[^"]*)"/g;
            var m;
            while ((m = re.exec(html))) urls.push(m[1]);
            var good = [];
            for (var j = 0; j < urls.length; j++) {
              var u = urls[j];
              if (u.indexOf('/' + app + '/') === 0) good.push(u);
            }
            if (good.length > 0) inject(good);
          } catch (e) {}
        };
        x.onerror = function () {};
        x.send();
      })();
    </script>
  </body>
</html>
